<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TTS Operations Dashboard · Pattern</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #030b18; color: #94A3B8; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; height: 100vh; overflow: hidden; background-image: radial-gradient(ellipse 80% 40% at 50% -5%, rgba(123,95,255,0.13) 0%, transparent 60%); }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #1e2d45; border-radius: 8px; }
    input, select, button { font-family: inherit; }
    input:focus, select:focus { outline: 1px solid #7B5FFF; outline-offset: -1px; }
    button:focus-visible { outline: 2px solid #7B5FFF; outline-offset: 2px; }
    .fade-in { animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    .card { background: #071120; border: 1px solid rgba(148,163,184,0.08); border-radius: 14px; }
    .hover-row { transition: background 0.1s; }
    .hover-row:hover { background: rgba(123,95,255,0.05) !important; }
    .pm-item { cursor: pointer; border-left: 3px solid transparent; transition: background 0.1s; padding: 10px 16px; }
    .pm-item:hover { background: rgba(123,95,255,0.07); }
    .pm-item.active { background: rgba(123,95,255,0.14); border-left-color: #7B5FFF; }
    .status-badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; }
    .btn-download { display: inline-flex; align-items: center; gap: 6px; padding: 7px 16px; background: #7B5FFF; color: #fff; border: none; border-radius: 9px; cursor: pointer; font-size: 12px; font-weight: 700; transition: all 0.15s; letter-spacing: 0.3px; box-shadow: 0 0 20px rgba(123,95,255,0.35); }
    .btn-download:hover { background: #8f74ff; transform: translateY(-1px); box-shadow: 0 0 28px rgba(123,95,255,0.5); }
    input[type=number], input[type=text], select { background: #091626 !important; border: 1px solid rgba(148,163,184,0.1) !important; color: #CBD5E1 !important; }
    option { background: #071120; color: #94A3B8; }
    th { color: #475569 !important; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo, useCallback, useRef } = React;

// ─── Constants ────────────────────────────────────────────────────────────────
const API_DATES  = 'https://community-prod-n8n.pattern.com/webhook/tts-proxy-dates';
const API_REPORT = 'https://community-prod-n8n.pattern.com/webhook/tts-proxy-report';
const VIDEO_GOAL = 100;
const PM_COLORS  = ['#7B5FFF','#38BDF8','#10B981','#F59E0B','#EF4444','#8B5CF6','#06B6D4','#84CC16','#F97316','#14B8A6','#6366F1','#EC4899'];
const PERIODS    = [['daily','Daily'],['7d','Last 7 Days'],['mtd','MTD'],['30d','Last 30 Days']];
const PERIOD_LABEL = { daily:'Today', '7d':'Last 7 Days', mtd:'Month to Date', '30d':'Last 30 Days' };

// ─── LocalStorage helpers ─────────────────────────────────────────────────────
const lsGet = (k, def) => { try { const v = localStorage.getItem(k); return v !== null ? JSON.parse(v) : def; } catch { return def; } };
const lsSet = (k, v)   => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

// ─── Cache & Throttle ────────────────────────────────────────────────────────
const CACHE_TTL = 12 * 60 * 60 * 1000; // 12h
const cKey = url => 'tts_c_' + url.slice(-55).replace(/\W/g,'_');
const cachedFetch = async url => {
  const k = cKey(url), c = lsGet(k, null);
  if (c && Date.now()-c.ts < CACHE_TTL) return c.data;
  const data = await fetch(url).then(r => { if(!r.ok) throw new Error(r.status); return r.json(); });
  lsSet(k, { ts: Date.now(), data });
  return data;
};
let _tActive = 0; const _tQueue = [];
const _tRun = () => { while(_tActive<3&&_tQueue.length){const{fn,res,rej}=_tQueue.shift();_tActive++;fn().then(res).catch(rej).finally(()=>{_tActive--;_tRun();}); } };
const tFetch = fn => new Promise((res,rej)=>{ _tQueue.push({fn,res,rej}); _tRun(); });
const clearCache = () => { Object.keys(localStorage).filter(k=>k.startsWith('tts_c_')).forEach(k=>localStorage.removeItem(k)); };

// ─── Lifecycle config ─────────────────────────────────────────────────────────
const LC = {
  active:  { label:'Active',  color:'#10B981', bg:'rgba(16,185,129,0.1)',  dot:'●' },
  paused:  { label:'Paused',  color:'#F59E0B', bg:'rgba(245,158,11,0.1)',  dot:'⏸' },
  churned: { label:'Churned', color:'#64748B', bg:'rgba(100,116,139,0.1)', dot:'○' },
};

// ─── Migration ────────────────────────────────────────────────────────────────
(function migrate() {
  try {
    const s = localStorage.getItem('tts_pms');
    if (s) { const p = JSON.parse(s); if (!Array.isArray(p) || p.length < 10) { localStorage.removeItem('tts_pms'); localStorage.removeItem('tts_brand_map'); } }
  } catch {}
})();

// ─── Period aggregation ───────────────────────────────────────────────────────
function aggregateData(rows) {
  const map = {};
  rows.forEach(row => {
    if (!row.brand_name) return;
    if (!map[row.brand_name]) map[row.brand_name] = { brand_name: row.brand_name, new_videos:0, sample_request:0, sample_approved:0, gmv:0, tp_creator_count:0, l3_plus:0, tp_accepted:0, _ctr:0, _ctor:0, _aov:0, _days:0, dod:null };
    const b = map[row.brand_name];
    b.new_videos      += row.new_videos || 0;
    b.sample_request  += row.sample_request || 0;
    b.sample_approved += row.sample_approved || 0;
    b.gmv             += row.gmv || 0;
    b.tp_creator_count+= row.tp_creator_count || 0;
    b.l3_plus         += row.l3_plus || 0;
    b.tp_accepted     += row.tp_accepted || 0;
    b._ctr  += row.video_ctr || 0;
    b._ctor += row.video_ctor || 0;
    b._aov  += row.aov || 0;
    b._days++;
  });
  return Object.values(map).map(b => ({ ...b, video_ctr: b._days ? b._ctr/b._days : 0, video_ctor: b._days ? b._ctor/b._days : 0, aov: b._days ? b._aov/b._days : 0, tp_accept_rate: b.tp_creator_count ? b.tp_accepted/b.tp_creator_count : 0 }));
}

// ─── Formatters ───────────────────────────────────────────────────────────────
const fmt$   = v => (v==null||isNaN(v)) ? '—' : '$'+Number(v).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0});
const fmtN   = v => (v==null||isNaN(v)) ? '—' : Number(v).toLocaleString();
const fmtPct = v => (v==null||isNaN(v)) ? '—' : (v*100).toFixed(1)+'%';
const fmtDod = v => { if (v==null||isNaN(v)) return '—'; const p=(v*100).toFixed(1); return (v>0?'+':'')+p+'%'; };
const dodColor = v => !v&&v!==0 ? '#64748B' : v>0 ? '#10B981' : v<0 ? '#EF4444' : '#64748B';
const initials = name => name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);

// ─── Default PMs ─────────────────────────────────────────────────────────────
const DEFAULT_PMS = [
  {id:'abrar',name:'Abrar',color:PM_COLORS[0]},{id:'aman',name:'Aman',color:PM_COLORS[1]},
  {id:'amruta',name:'Amruta',color:PM_COLORS[2]},{id:'ansh',name:'Ansh',color:PM_COLORS[3]},
  {id:'harshad',name:'Harshad',color:PM_COLORS[4]},{id:'kaustubh',name:'Kaustubh',color:PM_COLORS[5]},
  {id:'oshin',name:'Oshin',color:PM_COLORS[6]},{id:'palak',name:'Palak',color:PM_COLORS[7]},
  {id:'ritika',name:'Ritika',color:PM_COLORS[8]},{id:'sakshi',name:'Sakshi',color:PM_COLORS[9]},
  {id:'sanskrati',name:'Sanskrati',color:PM_COLORS[10]},{id:'sumit',name:'Sumit',color:PM_COLORS[11]},
  {id:'taanisha',name:'Taanisha',color:PM_COLORS[0]},{id:'tanishk',name:'Tanishk',color:PM_COLORS[1]},
  {id:'yutong',name:'Yutong Shen',color:PM_COLORS[2]},
];

const DEFAULT_BRAND_MAP = {
    "Baby Brezza":"abrar","Integrative Therapeutics":"abrar","Leatherman Tools":"abrar","Life Extension Supplements":"abrar","PBfit":"abrar","youtheory":"abrar",
  "Davids Premium Oral Care":"aman","Fix-a-Flat":"aman","Flora Health Shop":"aman","Natural Factors":"aman","Olay Skin Care":"aman","Renzo's Vitamins":"aman",
  "HALEYS Beauty":"amruta","Kiyomi Skin":"amruta","Kotex":"amruta","skinfix":"amruta","Skinfix":"amruta","Ulta Beauty":"amruta",
  "GAT Sport USA":"ansh","K9 Feline Natural":"ansh","livehumann":"ansh","MegaFood Shop":"ansh","Metagenics Shop":"ansh","PetSafe Brand":"ansh","Saje Natural Wellness":"ansh","Strider Bikes":"ansh",
  "Emerald Labs":"harshad","Floradix":"harshad","Gaia Herbs Shop":"harshad","One A Day Shop":"harshad","Zenwise Health":"harshad",
  "Away Travel":"kaustubh","Forever 21":"kaustubh","Roxy":"kaustubh","Volcom":"kaustubh",
  "CeraVe":"oshin","Color Wow Hair":"oshin","Peace Out Skincare":"oshin","Setexgrip":"oshin","Winky Lux":"oshin",
  "Beeup":"palak","Buttermints":"palak","drinkkoia":"palak","Mercola Market Shop":"palak","Pure Encapsulations Shop":"palak","Weider Global Nutrition":"palak","Wiley's Finest Shop":"palak",
  "Megababe":"ritika","NOW":"ritika","OLLY Wellness":"ritika","Philips Shop US":"ritika","Vital Proteins Shop":"ritika",
  "Fazit":"sakshi","ILIA Beauty":"sakshi","New Chapter Inc":"sakshi","SuavecitoPomade":"sakshi","The Original Swedish Candy":"sakshi","Uqora Official":"sakshi",
  "Balance of Nature Shop":"sanskrati","Heatonist - Stay Spicy":"sanskrati","Hims & Hers":"sanskrati","Sakura of America Shop":"sanskrati","Superior Source":"sanskrati",
  "KAEX USA":"sumit","MuscleTech":"sumit","NaturalSlimUSA":"sumit","Optimum Nutrition Shop":"sumit","SIXSTAR PRO":"sumit",
  "BallBoyz Soap":"taanisha","Coco&Eve":"taanisha","Farmacy Beauty":"taanisha","Host Defense Mushrooms":"taanisha","Urban Decay Cosmetics":"taanisha",
  "Barimelts":"tanishk","Dr. Tobias":"tanishk","Obvi":"tanishk","PureBoost":"tanishk","SmartMouth":"tanishk","SuperFeet Insoles":"tanishk","VitaCup":"tanishk",
  "Azzaro":"yutong","Mugler Fragrances":"yutong","Phomemo":"yutong","TruSkin":"yutong",
};

const DEFAULT_GOALS = {
  "BallBoyz Soap":500,"Barimelts":750,"Better Dog Supplements":500,
  "Brutus Broth":1200,"CeraVe":3800,"Coco&Eve":800,"CureHydration":2000,
  "Davids Premium Oral Care":500,"Dr. Tobias":750,"Fazit":2100,
  "Fix-a-Flat":500,"Flora Health Shop":600,"GAT Sport USA":2000,
  "HALEYS Beauty":700,"Heatonist - Stay Spicy":700,"Hims & Hers":500,
  "ILIA Beauty":970,"Integrative Therapeutics":1000,"Kiyomi Skin":700,
  "Life Extension Supplements":1200,"Megababe":3000,"MegaFood Shop":3000,
  "Metagenics":1200,"Moncho Moreno":1000,"MuscleTech":2350,
  "Natural Factors":1000,"NaturalSlimUSA":1500,"New Chapter Inc":3400,
  "NOW":1500,"OLLY Wellness":2700,"One A Day Shop":1500,
  "Optimum Nutrition Shop":500,"PBfit":1500,"Philips Shop US":75,
  "Seeking Health":750,"Setex":500,"SIXSTAR PRO":1000,"skinfix":2500,
  "SmartMouth":2000,"SuavecitoPomade":4200,"Ulta Beauty":850,
  "Uqora Official":900,"Urban Decay Cosmetics":3000,"Vital Proteins Shop":1035,
  "Weider Global Nutrition":1500,"Wiley's Finest Shop":2000,
  "Winky Lux":1100,"youtheory":3000,
};

// ════════════════════════════════════════════════════════════════════════════
// APP
// ════════════════════════════════════════════════════════════════════════════
function App() {
  const [dates, setDates]           = useState([]);
  const [date, setDate]             = useState('');
  const [report, setReport]         = useState([]);
  const [loading, setLoading]       = useState(false);
  const [apiError, setApiError]     = useState('');
  const [pms, setPms]               = useState(() => lsGet('tts_pms', DEFAULT_PMS));
  const [brandMap, setBrandMap]     = useState(() => lsGet('tts_brand_map', DEFAULT_BRAND_MAP));
  const [goals, setGoals]           = useState(() => ({ ...DEFAULT_GOALS, ...lsGet('tts_goals', {}) }));
  const [selectedPm, setSelectedPm] = useState(null);
  const [view, setView]             = useState('pm');
  const [showSettings, setShowSettings] = useState(false);
  const [sortBy, setSortBy]         = useState('gmv');
  const [sortDir, setSortDir]       = useState('desc');
  const [period, setPeriod]         = useState('daily');
  const [aggReport, setAggReport]   = useState([]);
  const [aggLoading, setAggLoading] = useState(false);
  const [videoData, setVideoData]   = useState({});
  const [videoLoading, setVideoLoading] = useState(false);
  const [brandLifecycle, setBrandLifecycle] = useState(() => lsGet('tts_brand_lifecycle', {}));
  const [customBrands, setCustomBrands]     = useState(() => lsGet('tts_custom_brands', []));
  const [prioritySet, setPrioritySet]       = useState(() => new Set(lsGet('tts_priority_brands', [])));

  // Detect PM share mode from URL (?pm=oshin)
  const sharedPmId = useMemo(() => new URLSearchParams(window.location.search).get('pm') || '', []);
  const isShareMode = !!sharedPmId;

  useEffect(() => lsSet('tts_pms', pms),       [pms]);
  useEffect(() => lsSet('tts_brand_map', brandMap), [brandMap]);
  useEffect(() => lsSet('tts_goals', goals),   [goals]);
  useEffect(() => lsSet('tts_brand_lifecycle', brandLifecycle), [brandLifecycle]);
  useEffect(() => lsSet('tts_custom_brands', customBrands),     [customBrands]);
  useEffect(() => lsSet('tts_priority_brands', [...prioritySet]), [prioritySet]);

  const togglePriority = useCallback(brand => {
    setPrioritySet(prev => { const n = new Set(prev); n.has(brand) ? n.delete(brand) : n.size < 20 ? n.add(brand) : null; return n; });
  }, []);
  const setLifecycle = useCallback((brand, lc) => setBrandLifecycle(prev => ({ ...prev, [brand]: lc })), []);
  const addCustomBrand = useCallback((brand) => setCustomBrands(prev => prev.find(b=>b.name===brand.name) ? prev : [...prev, brand]), []);
  const removeCustomBrand = useCallback((name) => setCustomBrands(prev => prev.filter(b=>b.name!==name)), []);

  useEffect(() => {
    setApiError('');
    cachedFetch(API_DATES)
      .then(d => { const list = Array.isArray(d) ? d : (d.dates||[]); setDates(list); if (list.length) setDate(list[0]); })
      .catch(() => setApiError('CORS_OR_NETWORK'));
  }, []);

  useEffect(() => {
    if (!date) return;
    setLoading(true); setApiError('');
    cachedFetch(`${API_REPORT}?date=${date}`)
      .then(d => { setReport(Array.isArray(d) ? d : []); setLoading(false); })
      .catch(() => { setApiError('CORS_OR_NETWORK'); setLoading(false); });
  }, [date]);

  useEffect(() => {
    if (period === 'daily' || !dates.length) return;
    setAggLoading(true);
    const today = dates[0];
    let toFetch;
    if (period === '7d')  toFetch = dates.slice(0,7);
    else if (period === 'mtd') { const m = today.slice(0,7); toFetch = dates.filter(d=>d.startsWith(m)); }
    else if (period === '30d') toFetch = dates.slice(0,30);
    Promise.all(toFetch.map(d => tFetch(() => cachedFetch(`${API_REPORT}?date=${d}`)).catch(()=>[])))
      .then(all => { setAggReport(aggregateData(all.flat())); setAggLoading(false); });
  }, [period, dates]);

  useEffect(() => {
    if ((view !== 'video' && view !== 'priority') || !dates.length) return;
    const today        = dates[0];
    const currentMonth = today.slice(0,7);
    const dayOfMonth   = parseInt(today.slice(8,10));
    const lmd          = new Date(today); lmd.setDate(1); lmd.setMonth(lmd.getMonth()-1);
    const lastMoPrefix = `${lmd.getFullYear()}-${String(lmd.getMonth()+1).padStart(2,'0')}`;
    const mtdDates     = dates.filter(d => d.startsWith(currentMonth));
    const lastMoDates  = dates.filter(d => d.startsWith(lastMoPrefix) && parseInt(d.slice(8,10)) <= dayOfMonth);
    const allNeeded    = [...new Set([...dates.slice(0,30), ...mtdDates, ...lastMoDates])];
    const missing      = allNeeded.filter(d => !videoData[d]);
    if (!missing.length) return;
    setVideoLoading(true);
    Promise.all(missing.map(d => tFetch(() => cachedFetch(`${API_REPORT}?date=${d}`)).catch(()=>[])))
      .then(results => {
        setVideoData(prev => {
          const next = { ...prev };
          missing.forEach((d, i) => { next[d] = results[i]; });
          return next;
        });
        setVideoLoading(false);
      });
  }, [view, dates]);

  const activeReport = period === 'daily' ? report : aggReport;
  const isLoading    = loading || aggLoading;
  const brandList    = useMemo(() => activeReport.map(r => r.brand_name), [activeReport]);
  const byBrand      = useMemo(() => Object.fromEntries(activeReport.map(r => [r.brand_name, r])), [activeReport]);
  const getPmBrands  = useCallback((pmId) => brandList.filter(b => brandMap[b] === pmId), [brandList, brandMap]);
  const unassigned   = useMemo(() => brandList.filter(b => !brandMap[b]), [brandList, brandMap]);

  const getPmStats = useCallback((pmId) => {
    const brands = pmId === '__unassigned' ? unassigned : getPmBrands(pmId);
    return brands.reduce((acc, b) => {
      const d = byBrand[b]; if (!d) return acc;
      acc.gmv += d.gmv||0; acc.videos += d.new_videos||0; acc.req += d.sample_request||0;
      acc.approved += d.sample_approved||0; acc.goal += parseInt(goals[b]||0); acc.brands++;
      return acc;
    }, { gmv:0, videos:0, req:0, approved:0, goal:0, brands:0 });
  }, [getPmBrands, unassigned, byBrand, goals]);

  const handleSort = col => { if (sortBy===col) setSortDir(d=>d==='asc'?'desc':'asc'); else { setSortBy(col); setSortDir('desc'); } };
  const updateGoal  = (brand, val) => setGoals(prev => ({ ...prev, [brand]: val }));
  const assignBrand = (brand, pmId) => setBrandMap(prev => ({ ...prev, [brand]: pmId||undefined }));

  const sortedBrands = useMemo(() => {
    const brands = selectedPm?.id==='__unassigned' ? unassigned : (selectedPm ? getPmBrands(selectedPm.id) : []);
    return [...brands].sort((a,b) => {
      const da = byBrand[a], db = byBrand[b]; let va, vb;
      switch (sortBy) {
        case 'gmv':      va=da?.gmv||0;             vb=db?.gmv||0;             break;
        case 'videos':   va=da?.new_videos||0;       vb=db?.new_videos||0;      break;
        case 'req':      va=da?.sample_request||0;   vb=db?.sample_request||0;  break;
        case 'approved': va=da?.sample_approved||0;  vb=db?.sample_approved||0; break;
        case 'dod':      va=da?.dod||0;              vb=db?.dod||0;             break;
        case 'goal_pct': { const ga=parseInt(goals[a]||0),gb=parseInt(goals[b]||0); va=ga>0?(da?.sample_approved||0)/ga:-1; vb=gb>0?(db?.sample_approved||0)/gb:-1; break; }
        default: va=vb=0;
      }
      return sortDir==='asc' ? va-vb : vb-va;
    });
  }, [selectedPm, unassigned, getPmBrands, byBrand, sortBy, sortDir, goals]);

  // In share mode, auto-select the shared PM
  const sharedPm = isShareMode ? pms.find(p => p.id === sharedPmId) : null;

  if (isShareMode && sharedPm) {
    const pmBrands = getPmBrands(sharedPm.id);
    return (
      <div style={{ minHeight:'100vh', background:'#030b18', backgroundImage:'radial-gradient(ellipse 80% 40% at 50% -5%, rgba(123,95,255,0.13) 0%, transparent 60%)' }}>
        <PMShareView pm={sharedPm} brands={pmBrands} byBrand={byBrand} goals={goals} updateGoal={updateGoal} brandLifecycle={brandLifecycle} period={period} />
      </div>
    );
  }

  return (
    <div style={{ display:'flex', flexDirection:'column', height:'100vh' }}>
      <Header
        dates={dates} date={date} setDate={d=>{setDate(d);setPeriod('daily');}}
        view={view} setView={setView}
        period={period} setPeriod={setPeriod}
        loading={isLoading || videoLoading} apiError={apiError}
        onSettings={() => setShowSettings(true)}
      />
      <div style={{ display:'flex', flex:1, overflow:'hidden' }}>
        {view === 'pm' && (
          <Sidebar pms={pms} selectedPm={selectedPm} setSelectedPm={setSelectedPm} getPmStats={getPmStats} unassignedCount={unassigned.length} />
        )}
        <main style={{ flex:1, overflowY:'auto', padding:'28px 32px' }}>
          {apiError === 'CORS_OR_NETWORK' ? <CorsError /> :
           view === 'video'    ? <VideoTracker dates={dates} videoData={videoData} videoLoading={videoLoading} pms={pms} brandMap={brandMap} goals={goals} updateGoal={updateGoal} brandLifecycle={brandLifecycle} setLifecycle={setLifecycle} prioritySet={prioritySet} togglePriority={togglePriority} /> :
           view === 'priority' ? <PriorityView dates={dates} videoData={videoData} videoLoading={videoLoading} pms={pms} brandMap={brandMap} goals={goals} brandLifecycle={brandLifecycle} prioritySet={prioritySet} togglePriority={togglePriority} setView={setView} /> :
           view === 'manager'  ? <ManagerView pms={pms} getPmStats={getPmStats} getPmBrands={getPmBrands} byBrand={byBrand} goals={goals} period={period} onDrillIn={pm=>{setSelectedPm(pm);setView('pm');}} brandLifecycle={brandLifecycle} /> :
           selectedPm          ? <PMView pm={selectedPm} brands={sortedBrands} byBrand={byBrand} goals={goals} updateGoal={updateGoal} sortBy={sortBy} sortDir={sortDir} handleSort={handleSort} stats={getPmStats(selectedPm.id)} period={period} brandLifecycle={brandLifecycle} /> :
           <EmptyState />}
        </main>
      </div>
      {showSettings && <SettingsModal pms={pms} setPms={setPms} brandList={brandList} brandMap={brandMap} assignBrand={assignBrand} brandLifecycle={brandLifecycle} setLifecycle={setLifecycle} customBrands={customBrands} addCustomBrand={addCustomBrand} removeCustomBrand={removeCustomBrand} prioritySet={prioritySet} onClearCache={()=>{clearCache();alert('Cache cleared. Data will refresh on next load.');}} onClose={()=>setShowSettings(false)} />}
    </div>
  );
}

// ════════════════════════════════════════════════════════════════════════════
// HEADER
// ════════════════════════════════════════════════════════════════════════════
function Header({ dates, date, setDate, view, setView, period, setPeriod, loading, apiError, onSettings }) {
  const NavBtn = ({ v, label }) => (
    <button onClick={() => setView(v)} style={{
      padding:'6px 16px',
      background: view===v ? 'rgba(123,95,255,0.16)' : 'transparent',
      color: view===v ? '#a58bff' : '#64748B',
      border:'none', cursor:'pointer', fontSize:'13px',
      fontWeight: view===v ? 700 : 500, borderRadius:'7px', transition:'all 0.15s', whiteSpace:'nowrap'
    }}>{label}</button>
  );
  return (
    <header style={{ background:'rgba(3,11,24,0.88)', backdropFilter:'blur(14px)', borderBottom:'1px solid rgba(148,163,184,0.08)', padding:'0 20px', display:'flex', alignItems:'center', gap:'8px', height:'56px', flexShrink:0, overflowX:'auto' }}>
      <div style={{ display:'flex', alignItems:'center', gap:'9px', flexShrink:0, marginRight:'8px' }}>
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
          <path d="M11 2L20 11L11 20L2 11L11 2Z" fill="url(#pg-hdr)" />
          <defs>
            <linearGradient id="pg-hdr" x1="2" y1="2" x2="20" y2="20" gradientUnits="userSpaceOnUse">
              <stop stopColor="#38BDF8"/><stop offset="1" stopColor="#7B5FFF"/>
            </linearGradient>
          </defs>
        </svg>
        <span style={{ fontWeight:800, fontSize:'15px', color:'#F1F5F9', letterSpacing:'-0.3px' }}>TTS Ops</span>
      </div>
      <div style={{ width:'1px', height:'20px', background:'rgba(148,163,184,0.1)', flexShrink:0, margin:'0 4px' }} />
      <div style={{ display:'flex', gap:'2px', flexShrink:0 }}>
        <NavBtn v="pm"       label="PM View" />
        <NavBtn v="manager"  label="Manager" />
        <NavBtn v="video"    label="📹 Videos" />
        <NavBtn v="priority" label="⭐ Priority" />
      </div>
      <div style={{ width:'1px', height:'20px', background:'rgba(148,163,184,0.1)', flexShrink:0, margin:'0 4px' }} />
      {view !== 'video' && <>
        {period === 'daily' && (
          <select value={date} onChange={e=>setDate(e.target.value)} style={{ background:'#071120', border:'1px solid rgba(148,163,184,0.1)', color:'#94A3B8', padding:'5px 10px', borderRadius:'7px', fontSize:'12px', cursor:'pointer', flexShrink:0 }}>
            {dates.map(d=><option key={d} value={d}>{d}</option>)}
          </select>
        )}
        <div style={{ display:'flex', background:'#071120', border:'1px solid rgba(148,163,184,0.1)', borderRadius:'8px', overflow:'hidden', flexShrink:0 }}>
          {PERIODS.map(([v,l]) => (
            <button key={v} onClick={()=>setPeriod(v)} style={{ padding:'5px 11px', background:period===v?'#7B5FFF':'transparent', color:period===v?'#fff':'#64748B', border:'none', cursor:'pointer', fontSize:'12px', fontWeight:period===v?700:400, transition:'all 0.15s', whiteSpace:'nowrap' }}>{l}</button>
          ))}
        </div>
      </>}
      <div style={{ marginLeft:'auto', display:'flex', alignItems:'center', gap:'10px', flexShrink:0 }}>
        {loading && <span style={{ color:'#475569', fontSize:'12px', display:'flex', alignItems:'center', gap:'5px' }}><Spinner />Loading...</span>}
        <button onClick={()=>{ if(confirm('Reset PM assignments and brand map to latest defaults?')){ localStorage.removeItem('tts_pms'); localStorage.removeItem('tts_brand_map'); location.reload(); } }}
          style={{ background:'#091626', border:'1px solid rgba(148,163,184,0.1)', color:'#64748B', padding:'5px 13px', borderRadius:'7px', cursor:'pointer', fontSize:'13px', transition:'all 0.15s' }}
          onMouseEnter={e=>e.target.style.color='#F1F5F9'} onMouseLeave={e=>e.target.style.color='#64748B'}>
          ↺ Reset
        </button>
        <button onClick={onSettings} style={{ background:'#091626', border:'1px solid rgba(148,163,184,0.1)', color:'#64748B', padding:'5px 13px', borderRadius:'7px', cursor:'pointer', fontSize:'13px', transition:'all 0.15s' }}
          onMouseEnter={e=>e.target.style.color='#F1F5F9'} onMouseLeave={e=>e.target.style.color='#64748B'}>
          ⚙ Settings
        </button>
      </div>
    </header>
  );
}

// ════════════════════════════════════════════════════════════════════════════
// SIDEBAR
// ════════════════════════════════════════════════════════════════════════════
function Sidebar({ pms, selectedPm, setSelectedPm, getPmStats, unassignedCount }) {
  return (
    <aside style={{ width:'220px', background:'#050d1c', borderRight:'1px solid rgba(148,163,184,0.06)', overflowY:'auto', flexShrink:0 }}>
      <div style={{ padding:'14px 16px 8px', fontSize:'10px', fontWeight:700, color:'#475569', textTransform:'uppercase', letterSpacing:'1px' }}>Project Managers</div>
      {pms.map(pm => {
        const s = getPmStats(pm.id);
        const active = selectedPm?.id === pm.id;
        return (
          <div key={pm.id} className={`pm-item${active?' active':''}`} onClick={()=>setSelectedPm(pm)} style={{ borderLeftColor: active ? pm.color : 'transparent' }}>
            <div style={{ display:'flex', alignItems:'center', gap:'10px' }}>
              <div style={{ width:'30px', height:'30px', borderRadius:'8px', background:`${pm.color}22`, border:`1px solid ${pm.color}44`, display:'flex', alignItems:'center', justifyContent:'center', fontSize:'11px', fontWeight:700, color:pm.color, flexShrink:0 }}>{initials(pm.name)}</div>
              <div>
                <div style={{ fontWeight:600, fontSize:'13px', color: active?'#F1F5F9':'#CBD5E1', lineHeight:1.2 }}>{pm.name}</div>
                <div style={{ fontSize:'11px', color:'#475569', marginTop:'1px' }}>{s.brands} brands · {fmt$(s.gmv)}</div>
              </div>
            </div>
          </div>
        );
      })}
      {unassignedCount > 0 && (
        <div className={`pm-item${selectedPm?.id==='__unassigned'?' active':''}`} onClick={()=>setSelectedPm({id:'__unassigned',name:'Unassigned',color:'#475569'})} style={{ marginTop:'8px', borderTop:'1px solid rgba(148,163,184,0.05)', borderLeftColor: selectedPm?.id==='__unassigned'?'#475569':'transparent' }}>
          <div style={{ display:'flex', alignItems:'center', gap:'10px' }}>
            <div style={{ width:'30px', height:'30px', borderRadius:'8px', background:'#091626', border:'1px solid rgba(148,163,184,0.1)', display:'flex', alignItems:'center', justifyContent:'center', fontSize:'11px', fontWeight:700, color:'#475569' }}>?</div>
            <div>
              <div style={{ fontWeight:600, fontSize:'13px', color:'#475569' }}>Unassigned</div>
              <div style={{ fontSize:'11px', color:'#334155' }}>{unassignedCount} brands</div>
            </div>
          </div>
        </div>
      )}
    </aside>
  );
}

// PM VIEW
// ════════════════════════════════════════════════════════════════════════════
function PMView({ pm, brands, byBrand, goals, updateGoal, sortBy, sortDir, handleSort, stats, period }) {
  const goalPct = stats.goal > 0 ? Math.min(100, (stats.approved/stats.goal)*100) : null;
  return (
    <div className="fade-in">
      <div style={{ display:'flex', alignItems:'center', gap:'12px', marginBottom:'24px' }}>
        <div style={{ width:'36px', height:'36px', borderRadius:'10px', background:`${pm.color}22`, border:`1px solid ${pm.color}55`, display:'flex', alignItems:'center', justifyContent:'center', fontSize:'14px', fontWeight:800, color:pm.color }}>{initials(pm.name)}</div>
        <div>
          <h2 style={{ fontSize:'20px', fontWeight:800, color:'#F1F5F9', letterSpacing:'-0.4px' }}>{pm.name}</h2>
          <div style={{ fontSize:'12px', color:'#64748B' }}>{brands.length} brands · {PERIOD_LABEL[period]}</div>
        </div>
      </div>
      <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(160px,1fr))', gap:'12px', marginBottom:'28px' }}>
        <StatCard label="Total GMV"       value={fmt$(stats.gmv)}      color="#10B981" icon="💰" />
        <StatCard label="New Videos"      value={fmtN(stats.videos)}   color="#38BDF8" icon="🎬" />
        <StatCard label="Sample Requests" value={fmtN(stats.req)}      color="#7B5FFF" icon="📦" />
        <StatCard label="Approved"        value={fmtN(stats.approved)} color="#F59E0B" icon="✅" />
        {goalPct !== null && <StatCard label="Goal Progress" value={`${stats.approved} / ${stats.goal}`} sub={`${goalPct.toFixed(0)}% of goal`} color={goalPct>=100?'#10B981':goalPct>=60?'#F59E0B':'#EF4444'} icon="🎯" bar={goalPct} />}
      </div>
      <div className="card" style={{ overflow:'hidden' }}>
        <div style={{ overflowX:'auto' }}>
          <table style={{ width:'100%', borderCollapse:'collapse', fontSize:'13px' }}>
            <thead>
              <tr style={{ background:'#050c17', borderBottom:'1px solid rgba(148,163,184,0.1)' }}>
                <Th label="Brand" />
                <Th label="Videos"    col="videos"   sortBy={sortBy} sortDir={sortDir} onSort={handleSort} right />
                {period==='daily' && <Th label="DoD%" col="dod" sortBy={sortBy} sortDir={sortDir} onSort={handleSort} right />}
                <Th label="GMV"       col="gmv"      sortBy={sortBy} sortDir={sortDir} onSort={handleSort} right />
                <Th label="Samples Req" col="req"    sortBy={sortBy} sortDir={sortDir} onSort={handleSort} right />
                <Th label="Approved"  col="approved" sortBy={sortBy} sortDir={sortDir} onSort={handleSort} right />
                <Th label="Goal / Progress" col="goal_pct" sortBy={sortBy} sortDir={sortDir} onSort={handleSort} />
                <Th label="TP Outreach" right /><Th label="L3+ Vids" right /><Th label="L3+ Accept%" right /><Th label="AOV" right />
              </tr>
            </thead>
            <tbody>
              {brands.map((brand, i) => {
                const d = byBrand[brand];
                const g = parseInt(goals[brand]||0);
                const pct = g>0&&d ? Math.min(100,((d.sample_approved||0)/g)*100) : null;
                const bc = pct==null?'':pct>=100?'#10B981':pct>=60?'#F59E0B':'#EF4444';
                return (
                  <tr key={brand} className="hover-row" style={{ borderBottom:'1px solid rgba(148,163,184,0.06)', background:'transparent' }}>
                    <td style={{ padding:'10px 14px', color:'#F1F5F9', fontWeight:600, whiteSpace:'nowrap' }}>{brand}</td>
                    <td style={{ padding:'10px 14px', textAlign:'right', color:'#94A3B8' }}>{fmtN(d?.new_videos)}</td>
                    {period==='daily' && <td style={{ padding:'10px 14px', textAlign:'right', color:dodColor(d?.dod), fontWeight:700 }}>{fmtDod(d?.dod)}</td>}
                    <td style={{ padding:'10px 14px', textAlign:'right', color:'#10B981', fontWeight:700 }}>{fmt$(d?.gmv)}</td>
                    <td style={{ padding:'10px 14px', textAlign:'right' }}>{fmtN(d?.sample_request)}</td>
                    <td style={{ padding:'10px 14px', textAlign:'right' }}>{fmtN(d?.sample_approved)}</td>
                    <td style={{ padding:'10px 14px', minWidth:'190px' }}>
                      <div style={{ display:'flex', alignItems:'center', gap:'7px' }}>
                        <input type="number" min="0" value={goals[brand]||''} onChange={e=>updateGoal(brand,e.target.value)} placeholder="Set goal"
                          style={{ width:'68px', background:'#091626', border:'1px solid rgba(148,163,184,0.1)', color:'#94A3B8', padding:'3px 7px', borderRadius:'5px', fontSize:'12px', textAlign:'center' }} />
                        {pct!==null && <>
                          <div style={{ flex:1, background:'#091626', borderRadius:'4px', height:'5px', minWidth:'50px' }}>
                            <div style={{ height:'100%', borderRadius:'4px', width:`${pct}%`, background:bc, transition:'width 0.3s' }} />
                          </div>
                          <span style={{ fontSize:'11px', color:bc, minWidth:'32px', fontWeight:700 }}>{pct.toFixed(0)}%</span>
                        </>}
                      </div>
                    </td>
                    <td style={{ padding:'10px 14px', textAlign:'right' }}>{fmtN(d?.tp_creator_count)}</td>
                    <td style={{ padding:'10px 14px', textAlign:'right' }}>{fmtN(d?.l3_plus)}</td>
                    <td style={{ padding:'10px 14px', textAlign:'right' }}>{fmtPct(d?.tp_accept_rate)}</td>
                    <td style={{ padding:'10px 14px', textAlign:'right' }}>{fmt$(d?.aov)}</td>
                  </tr>
                );
              })}
              {brands.length===0 && <tr><td colSpan={11} style={{ padding:'40px', textAlign:'center', color:'#475569' }}>No brands assigned. Use ⚙ Settings → Assign Brands.</td></tr>}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// MANAGER VIEW
// ════════════════════════════════════════════════════════════════════════════
function ManagerView({ pms, getPmStats, getPmBrands, byBrand, goals, onDrillIn, period }) {
  const allStats = pms.reduce((acc,pm) => {
    const s = getPmStats(pm.id); acc.gmv+=s.gmv; acc.videos+=s.videos; acc.req+=s.req; acc.approved+=s.approved; acc.goal+=s.goal; return acc;
  }, {gmv:0,videos:0,req:0,approved:0,goal:0});
  return (
    <div className="fade-in">
      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:'24px' }}>
        <div>
          <h2 style={{ fontSize:'20px', fontWeight:800, color:'#F1F5F9', letterSpacing:'-0.4px' }}>Manager Overview</h2>
          <div style={{ fontSize:'12px', color:'#64748B', marginTop:'2px' }}>{PERIOD_LABEL[period]} · {pms.length} PMs · {pms.reduce((a,pm)=>a+getPmStats(pm.id).brands,0)} brands</div>
        </div>
      </div>
      <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(160px,1fr))', gap:'12px', marginBottom:'32px' }}>
        <StatCard label="Portfolio GMV"    value={fmt$(allStats.gmv)}      color="#10B981" icon="💰" />
        <StatCard label="Total Videos"     value={fmtN(allStats.videos)}   color="#38BDF8" icon="🎬" />
        <StatCard label="Sample Requests"  value={fmtN(allStats.req)}      color="#7B5FFF" icon="📦" />
        <StatCard label="Total Approved"   value={fmtN(allStats.approved)} color="#F59E0B" icon="✅" />
        {allStats.goal>0 && <StatCard label="Portfolio Goal" value={`${allStats.approved}/${allStats.goal}`} sub={`${Math.min(100,allStats.approved/allStats.goal*100).toFixed(0)}%`} color={allStats.approved/allStats.goal>=1?'#10B981':allStats.approved/allStats.goal>=0.6?'#F59E0B':'#EF4444'} icon="🎯" bar={Math.min(100,allStats.approved/allStats.goal*100)} />}
      </div>
      <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(310px,1fr))', gap:'16px' }}>
        {pms.map(pm => {
          const s = getPmStats(pm.id);
          const brands = getPmBrands(pm.id);
          const goalPct = s.goal>0 ? Math.min(100,(s.approved/s.goal)*100) : null;
          const bc = goalPct==null?'':goalPct>=100?'#10B981':goalPct>=60?'#F59E0B':'#EF4444';
          const top = [...brands].sort((a,b)=>(byBrand[b]?.gmv||0)-(byBrand[a]?.gmv||0)).slice(0,3);
          return (
            <div key={pm.id} onClick={()=>onDrillIn(pm)} style={{ background:'#071120', border:'1px solid rgba(148,163,184,0.08)', borderTop:`3px solid ${pm.color}`, borderRadius:'12px', padding:'18px', cursor:'pointer', transition:'transform 0.15s, box-shadow 0.15s, border-color 0.15s' }}
              onMouseEnter={e=>{ e.currentTarget.style.transform='translateY(-2px)'; e.currentTarget.style.boxShadow=`0 8px 28px rgba(123,95,255,0.22)`; e.currentTarget.style.borderColor=`rgba(123,95,255,0.2)`; }}
              onMouseLeave={e=>{ e.currentTarget.style.transform=''; e.currentTarget.style.boxShadow=''; e.currentTarget.style.borderColor='rgba(148,163,184,0.08)'; }}>
              <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:'16px' }}>
                <div style={{ display:'flex', alignItems:'center', gap:'10px' }}>
                  <div style={{ width:'34px', height:'34px', borderRadius:'9px', background:`${pm.color}22`, border:`1px solid ${pm.color}44`, display:'flex', alignItems:'center', justifyContent:'center', fontSize:'12px', fontWeight:800, color:pm.color }}>{initials(pm.name)}</div>
                  <div>
                    <div style={{ fontWeight:700, fontSize:'15px', color:'#F1F5F9' }}>{pm.name}</div>
                    <div style={{ fontSize:'11px', color:'#64748B' }}>{s.brands} brands</div>
                  </div>
                </div>
                <div style={{ textAlign:'right' }}>
                  <div style={{ fontSize:'19px', fontWeight:800, color:'#10B981' }}>{fmt$(s.gmv)}</div>
                  <div style={{ fontSize:'10px', color:'#64748B', textTransform:'uppercase', letterSpacing:'0.5px' }}>GMV</div>
                </div>
              </div>
              <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:'10px', marginBottom:'14px' }}>
                <MiniStat label="Videos"   value={fmtN(s.videos)}   color="#38BDF8" />
                <MiniStat label="Req"      value={fmtN(s.req)}      color="#7B5FFF" />
                <MiniStat label="Approved" value={fmtN(s.approved)} color="#F59E0B" />
              </div>
              {goalPct!==null && (
                <div style={{ marginBottom:'12px' }}>
                  <div style={{ display:'flex', justifyContent:'space-between', fontSize:'11px', color:'#64748B', marginBottom:'5px' }}>
                    <span>Sample Goal</span><span style={{ color:bc, fontWeight:700 }}>{goalPct.toFixed(0)}%</span>
                  </div>
                  <div style={{ background:'#091626', borderRadius:'4px', height:'4px' }}>
                    <div style={{ height:'100%', borderRadius:'4px', width:`${goalPct}%`, background:bc, transition:'width 0.3s' }} />
                  </div>
                </div>
              )}
              {top.length>0 && <div style={{ fontSize:'11px', color:'#475569', borderTop:'1px solid rgba(148,163,184,0.06)', paddingTop:'10px' }}>Top: {top.join(' · ')}</div>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════════════════════
// VIDEO TRACKER
// ════════════════════════════════════════════════════════════════════════════
const STATUS_CONFIG = {
  active:   { label:'Active',      color:'#10B981', bg:'rgba(16,185,129,0.12)',  icon:'✅' },
  dipped:   { label:'Dipped',      color:'#EF4444', bg:'rgba(239,68,68,0.12)',   icon:'📉' },
  pipeline: { label:'In Pipeline', color:'#F59E0B', bg:'rgba(245,158,11,0.12)',  icon:'🔄' },
  inactive: { label:'Inactive',    color:'#64748B', bg:'rgba(71,85,105,0.12)',   icon:'💤' },
};

function computeBrandVideoStatus(brand, dates, videoData) {
  const getVids = d => (videoData[d]||[]).find(r=>r.brand_name===brand)?.new_videos || 0;
  const getSamp = d => (videoData[d]||[]).find(r=>r.brand_name===brand)?.sample_approved || 0;
  const last7sum = dates.slice(0,7).reduce((s,d)=>s+getVids(d),0);
  const prev7sum = dates.slice(7,14).reduce((s,d)=>s+getVids(d),0);
  const recentSamples = dates.slice(0,7).reduce((s,d)=>s+getSamp(d),0);
  if (last7sum===0 && recentSamples>0) return 'pipeline';
  if (last7sum===0 && prev7sum===0)    return 'inactive';
  if (prev7sum>=3 && last7sum < prev7sum*0.5) return 'dipped';
  return 'active';
}

function VideoTracker({ dates, videoData, videoLoading, pms, brandMap, goals, updateGoal, brandLifecycle, setLifecycle, prioritySet, togglePriority }) {
  const [statusFilter, setStatusFilter]   = useState('all');
  const [lcFilter, setLcFilter]           = useState('active'); // lifecycle filter
  const [pmFilter, setPmFilter]           = useState('all');
  const [vtSort, setVtSort]               = useState('avg7d');
  const [vtDir, setVtDir]                 = useState('desc');
  const [vtDate, setVtDate]               = useState('');
  const handleVtSort = col => { if(vtSort===col){setVtDir(d=>d==='desc'?'asc':'desc');}else{setVtSort(col);setVtDir('desc');} };

  const today        = dates[0] || '';
  const effectiveDate = vtDate || today;   // date shown in "Today" column
  const currentMonth = today.slice(0,7);
  const dayOfMonth   = parseInt(today.slice(8,10)) || 1;

  const lastMoPrefix = useMemo(() => {
    if (!today) return '';
    const d = new Date(today); d.setDate(1); d.setMonth(d.getMonth()-1);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  }, [today]);

  const mtdDates    = useMemo(() => dates.filter(d=>d.startsWith(currentMonth)), [dates, currentMonth]);
  const lastMoDates = useMemo(() => dates.filter(d=>d.startsWith(lastMoPrefix) && parseInt(d.slice(8,10))<=dayOfMonth), [dates, lastMoPrefix, dayOfMonth]);
  const lastMoLabel = lastMoPrefix ? `${lastMoPrefix.slice(5)} 1-${String(dayOfMonth).padStart(2,'0')}` : 'Last Mo.';

  // Dates available in videoData for the date picker
  const loadedDates = useMemo(() => dates.slice(0,30).filter(d => videoData[d]?.length > 0), [dates, videoData]);

  const allBrands = useMemo(() => {
    if (!dates.length || !videoData[dates[0]]) return [];
    return [...new Set(dates.slice(0,14).flatMap(d=>(videoData[d]||[]).map(r=>r.brand_name).filter(Boolean)))];
  }, [dates, videoData]);

  const brandAnalysis = useMemo(() => {
    if (!dates.length) return [];
    return allBrands.map(brand => {
      const getVids = d => (videoData[d]||[]).find(r=>r.brand_name===brand)?.new_videos||0;
      const getSamp = d => (videoData[d]||[]).find(r=>r.brand_name===brand)?.sample_approved||0;
      const last7    = dates.slice(0,7).map(getVids);
      const last7sum = last7.reduce((a,b)=>a+b,0);
      const prev7sum = dates.slice(7,14).reduce((s,d)=>s+getVids(d),0);
      const mtdSum   = mtdDates.reduce((s,d)=>s+getVids(d),0);
      const mtdAvg   = mtdDates.length ? mtdSum/mtdDates.length : 0;
      const mtdApproved = mtdDates.reduce((s,d)=>s+getSamp(d),0);
      const lastMoSum = lastMoDates.length>0 ? lastMoDates.reduce((s,d)=>s+getVids(d),0) : null;
      const status   = computeBrandVideoStatus(brand, dates, videoData);
      // today column uses the selected effectiveDate
      const todayVids = (videoData[effectiveDate]||[]).find(r=>r.brand_name===brand)?.new_videos||0;
      return { brand, last7, last7sum, prev7sum, avg7d:last7sum/7, today:todayVids, mtdSum, mtdAvg, mtdApproved, lastMoSum, status, pmId:brandMap[brand] };
    }).sort((a,b)=>b.last7sum-a.last7sum);
  }, [allBrands, dates, videoData, brandMap, mtdDates, lastMoDates, effectiveDate]);

  const dailyTotals = useMemo(() => dates.slice(0,7).map(d=>({ date:d.slice(5), total:(videoData[d]||[]).reduce((s,r)=>s+(r.new_videos||0),0) })), [dates, videoData]);
  const vtTodayTotal = (videoData[effectiveDate]||[]).reduce((s,r)=>s+(r.new_videos||0),0);
  const avg7d        = dailyTotals.length ? dailyTotals.reduce((s,d)=>s+d.total,0)/dailyTotals.length : 0;
  const mtdPortfolioTotal = useMemo(()=>mtdDates.reduce((sum,d)=>(videoData[d]||[]).reduce((s,r)=>s+(r.new_videos||0),sum),0),[mtdDates,videoData]);
  const mtdPortfolioAvg   = mtdDates.length ? mtdPortfolioTotal/mtdDates.length : 0;

  const statusCounts = brandAnalysis.reduce((acc,b)=>{ acc[b.status]=(acc[b.status]||0)+1; return acc; }, {});
  const filtered = useMemo(() => {
    const arr = brandAnalysis.filter(b=>{
      const lc = brandLifecycle[b.brand] || 'active';
      if (lcFilter !== 'all' && lc !== lcFilter) return false;
      if (statusFilter !== 'all' && b.status !== statusFilter) return false;
      if (pmFilter !== 'all' && b.pmId !== pmFilter) return false;
      return true;
    });
    return [...arr].sort((a,b)=>{
      let va,vb;
      if      (vtSort==='today')    { va=a.today;         vb=b.today; }
      else if (vtSort==='avg7d')    { va=a.avg7d;         vb=b.avg7d; }
      else if (vtSort==='mtdAvg')   { va=a.mtdAvg;        vb=b.mtdAvg; }
      else if (vtSort==='lastMo')   { va=a.lastMoSum??-1; vb=b.lastMoSum??-1; }
      else if (vtSort==='approved') { va=a.mtdApproved;   vb=b.mtdApproved; }
      else if (vtSort==='left')     { const ga=parseInt(goals[a.brand]||0),gb=parseInt(goals[b.brand]||0); va=ga>0?ga-a.mtdApproved:Infinity; vb=gb>0?gb-b.mtdApproved:Infinity; }
      else                          { va=a.avg7d;         vb=b.avg7d; }
      return vtDir==='asc'?va-vb:vb-va;
    });
  }, [brandAnalysis, statusFilter, pmFilter, vtSort, vtDir, goals]);

  const brandsAtGoal   = brandAnalysis.filter(b=>b.today>=VIDEO_GOAL).length;
  const totalBrands    = brandAnalysis.length;
  const vtGoalPct      = totalBrands > 0 ? Math.min(100,(brandsAtGoal/totalBrands)*100) : 0;
  const goalColor      = vtGoalPct>=80?'#10B981':vtGoalPct>=50?'#38BDF8':vtGoalPct>=30?'#F59E0B':'#EF4444';
  const chartMax   = Math.max(...dailyTotals.map(d=>d.total), VIDEO_GOAL, 1);

  // ── Download CSV ──────────────────────────────────────────────────────────
  const downloadCSV = () => {
    const header = [
      'Brand', 'PM', 'Status',
      `Videos on ${effectiveDate}`,
      'MTD Total', 'MTD Avg/d',
      'Approved MTD', 'Sample Goal',
      '7D Avg'
    ];
    const rows = filtered.map(b => {
      const pm   = pms.find(p => p.id === b.pmId);
      const sc   = STATUS_CONFIG[b.status];
      const goal = parseInt(goals[b.brand]||0);
      return [
        b.brand,
        pm?.name || '',
        sc.label,
        b.today,
        b.mtdSum,
        b.mtdAvg.toFixed(1),
        b.mtdApproved,
        goal || '',
        b.avg7d.toFixed(1)
      ];
    });
    const csv = [header, ...rows]
      .map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(','))
      .join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = `tts-video-report-${effectiveDate}.csv`;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
  };

  if (videoLoading && !allBrands.length) return (
    <div style={{ display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', height:'55vh', gap:'12px', color:'#475569' }}>
      <Spinner size={24} /><span style={{ fontSize:'14px' }}>Loading video data…</span>
    </div>
  );

  const todayLabel = vtDate ? vtDate.slice(5) : 'Today';

  return (
    <div className="fade-in">
      {/* ── Title bar ── */}
      <div style={{ display:'flex', alignItems:'center', gap:'10px', marginBottom:'24px', flexWrap:'wrap' }}>
        <h2 style={{ fontSize:'20px', fontWeight:800, color:'#F1F5F9', letterSpacing:'-0.4px' }}>📹 Video Tracker</h2>
        <span style={{ background:'rgba(123,95,255,0.15)', color:'#a58bff', fontSize:'11px', fontWeight:700, padding:'3px 10px', borderRadius:'20px' }}>100 Videos / Day Goal</span>
        {videoLoading && <span style={{ display:'flex', alignItems:'center', gap:'5px', fontSize:'12px', color:'#475569' }}><Spinner />…</span>}
        <div style={{ marginLeft:'auto' }}>
          <button className="btn-download" onClick={downloadCSV}>
            ⬇ Download Report
          </button>
        </div>
      </div>

      {/* ── KPI row ── */}
      <div style={{ display:'grid', gridTemplateColumns:'auto 1fr auto', gap:'16px', marginBottom:'24px', alignItems:'stretch' }}>
        <div className="card" style={{ padding:'20px 24px', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:'8px', minWidth:'160px' }}>
          <DonutProgress value={brandsAtGoal} max={totalBrands} color={goalColor} label={`${brandsAtGoal}/${totalBrands}`} />
          <div style={{ textAlign:'center' }}>
            <div style={{ fontSize:'13px', fontWeight:700, color:'#F1F5F9' }}>Brands at Goal</div>
            <div style={{ fontSize:'11px', color:'#64748B' }}>≥{VIDEO_GOAL} videos/brand</div>
          </div>
        </div>
        <div style={{ display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:'12px' }}>
          <StatCard label={vtDate ? vtDate.slice(5) : "Today"} value={vtTodayTotal.toString()} color="#38BDF8" icon="🎬" sub={`${brandsAtGoal} of ${totalBrands} brands at goal`} />
          <StatCard label="7-Day Avg"   value={avg7d.toFixed(1)}           color="#38BDF8"   icon="📈" sub="daily avg (videos)" />
          <StatCard label="MTD Avg"     value={mtdPortfolioAvg.toFixed(1)} color="#7B5FFF"   icon="📅" sub={`${mtdDates.length}d elapsed · ${mtdPortfolioTotal} total`} />
          <StatCard label="In Pipeline" value={(statusCounts.pipeline||0).toString()} color="#F59E0B" icon="🔄" sub="samples ready, no videos" />
        </div>
        <div className="card" style={{ padding:'16px 20px', minWidth:'260px' }}>
          <div style={{ fontSize:'11px', fontWeight:700, color:'#475569', textTransform:'uppercase', letterSpacing:'0.7px', marginBottom:'10px' }}>Last 7 Days Portfolio</div>
          <div style={{ display:'flex', alignItems:'flex-end', gap:'6px', height:'60px' }}>
            {dailyTotals.slice().reverse().map((d,i)=>{
              const h=Math.max(2,(d.total/chartMax)*60), isToday=i===dailyTotals.length-1;
              const col=d.total>=VIDEO_GOAL?'#10B981':d.total>=VIDEO_GOAL*0.7?'#38BDF8':'#F59E0B';
              return (
                <div key={d.date} style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center', gap:'4px' }}>
                  <div style={{ width:'100%', height:`${h}px`, background:col, borderRadius:'3px 3px 0 0', opacity:isToday?1:0.55 }} title={`${d.date}: ${d.total}`} />
                  <div style={{ fontSize:'9px', color:isToday?'#94A3B8':'#475569', whiteSpace:'nowrap' }}>{d.date}</div>
                </div>
              );
            })}
          </div>
          <div style={{ display:'flex', alignItems:'center', gap:'6px', marginTop:'8px' }}>
            <div style={{ width:'16px', height:'2px', background:'#38BDF8', borderRadius:'1px' }} />
            <span style={{ fontSize:'10px', color:'#475569' }}>100/day goal</span>
          </div>
        </div>
      </div>

      {/* ── Lifecycle filter row ── */}
      <div style={{ display:'flex', alignItems:'center', gap:'6px', marginBottom:'10px', flexWrap:'wrap' }}>
        <span style={{ fontSize:'11px', color:'#475569', fontWeight:700, textTransform:'uppercase', letterSpacing:'0.7px' }}>Brand:</span>
        {[['all','All'],['active','Active'],['paused','Paused'],['churned','Churned']].map(([v,l])=>(
          <button key={v} onClick={()=>setLcFilter(v)} style={{ padding:'4px 11px', borderRadius:'20px', fontSize:'12px', fontWeight:lcFilter===v?700:500, cursor:'pointer', border:'none',
            background: lcFilter===v ? (LC[v]?.bg||'rgba(123,95,255,0.15)') : 'transparent',
            color: lcFilter===v ? (LC[v]?.color||'#a58bff') : '#64748B',
            outline: lcFilter===v ? `1px solid ${LC[v]?.color||'#7B5FFF'}55` : '1px solid rgba(148,163,184,0.1)',
            transition:'all 0.15s' }}>{v!=='all'&&LC[v]?.dot+' '}{l}</button>
        ))}
      </div>

      {/* ── Filters row ── */}
      <div style={{ display:'flex', alignItems:'center', gap:'8px', marginBottom:'16px', flexWrap:'wrap' }}>
        <span style={{ fontSize:'11px', color:'#475569', fontWeight:700, textTransform:'uppercase', letterSpacing:'0.7px' }}>Status:</span>
        {[['all','All',brandAnalysis.filter(b=>(lcFilter==='all'||(brandLifecycle[b.brand]||'active')===lcFilter)).length],...Object.entries(STATUS_CONFIG).map(([k,v])=>[k,v.label,brandAnalysis.filter(b=>b.status===k&&(lcFilter==='all'||(brandLifecycle[b.brand]||'active')===lcFilter)).length])].map(([v,l,cnt])=>(
          <button key={v} onClick={()=>setStatusFilter(v)} style={{ padding:'5px 12px', borderRadius:'20px', fontSize:'12px', fontWeight:statusFilter===v?700:500, cursor:'pointer', border:'none', background:statusFilter===v?(STATUS_CONFIG[v]?.bg||'rgba(123,95,255,0.15)'):'transparent', color:statusFilter===v?(STATUS_CONFIG[v]?.color||'#a58bff'):'#64748B', outline:statusFilter===v?`1px solid ${STATUS_CONFIG[v]?.color||'#7B5FFF'}55`:'1px solid rgba(148,163,184,0.1)', transition:'all 0.15s' }}>{l} <span style={{opacity:0.7}}>({cnt})</span></button>
        ))}

        <div style={{ marginLeft:'auto', display:'flex', alignItems:'center', gap:'8px' }}>
          {/* Date filter */}
          <div style={{ display:'flex', alignItems:'center', gap:'5px' }}>
            <span style={{ fontSize:'11px', color:'#475569', fontWeight:700, textTransform:'uppercase', letterSpacing:'0.5px' }}>📅</span>
            <select value={vtDate} onChange={e=>setVtDate(e.target.value)}
              style={{ background:'#091626', border:'1px solid rgba(148,163,184,0.1)', color:'#94A3B8', padding:'5px 10px', borderRadius:'7px', fontSize:'12px', cursor:'pointer' }}>
              <option value="">Latest ({today})</option>
              {loadedDates.slice(1).map(d=><option key={d} value={d}>{d}</option>)}
            </select>
          </div>
          {/* PM filter */}
          <select value={pmFilter} onChange={e=>setPmFilter(e.target.value)}
            style={{ background:'#091626', border:'1px solid rgba(148,163,184,0.1)', color:'#94A3B8', padding:'5px 10px', borderRadius:'7px', fontSize:'12px', cursor:'pointer' }}>
            <option value="all">All PMs</option>
            {pms.map(pm=><option key={pm.id} value={pm.id}>{pm.name}</option>)}
          </select>
        </div>
      </div>

      {/* ── Table ── */}
      <div className="card" style={{ overflow:'hidden' }}>
        <div style={{ overflowX:'auto' }}>
          <table style={{ width:'100%', borderCollapse:'collapse', fontSize:'13px' }}>
            <thead>
              <tr style={{ background:'#050c17', borderBottom:'1px solid rgba(148,163,184,0.1)' }}>
                <Th label="⭐" />
                <Th label="Brand" />
                <Th label="PM" />
                <Th label={todayLabel}   col="today"    sortBy={vtSort} sortDir={vtDir} onSort={handleVtSort} right />
                <Th label="7D Avg"       col="avg7d"    sortBy={vtSort} sortDir={vtDir} onSort={handleVtSort} right />
                <Th label="MTD Avg"      col="mtdAvg"   sortBy={vtSort} sortDir={vtDir} onSort={handleVtSort} right />
                <Th label={lastMoLabel}  col="lastMo"   sortBy={vtSort} sortDir={vtDir} onSort={handleVtSort} right />
                <Th label="Last 7 Days" />
                <Th label="Status" />
                <Th label="Sample Goal" />
                <Th label="Approved MTD" col="approved" sortBy={vtSort} sortDir={vtDir} onSort={handleVtSort} right />
                <Th label="Left"         col="left"     sortBy={vtSort} sortDir={vtDir} onSort={handleVtSort} right />
              </tr>
            </thead>
            <tbody>
              {filtered.map((b, idx) => {
                const sc      = STATUS_CONFIG[b.status];
                const pm      = pms.find(p=>p.id===b.pmId);
                const goal    = parseInt(goals[b.brand]||0);
                const left    = goal>0 ? goal - b.mtdApproved : null;
                const leftColor = left===null?'':(left<=0?'#10B981':left<goal*0.3?'#F59E0B':'#EF4444');
                const lmDiff  = (b.lastMoSum!=null&&b.mtdSum!=null) ? b.mtdSum - b.lastMoSum : null;
                const lc      = brandLifecycle[b.brand] || 'active';
                const lcCfg   = LC[lc];
                const isPinned = prioritySet.has(b.brand);
                const lmColor= lmDiff===null?'#475569':lmDiff>0?'#10B981':lmDiff<0?'#EF4444':'#64748B';
                return (
                  <tr key={b.brand} className="hover-row" style={{ borderBottom:'1px solid rgba(148,163,184,0.06)', opacity: lc==='churned'?0.45:1 }}>
                    <td style={{ padding:'8px 4px 8px 10px', width:'28px', textAlign:'center' }}>
                      <button onClick={()=>togglePriority(b.brand)} title={isPinned?'Remove from Priority':'Add to Priority (max 20)'}
                        style={{ background:'none', border:'none', cursor:'pointer', fontSize:'14px', lineHeight:1, padding:'2px', color: isPinned?'#F59E0B':'#334155', transition:'all 0.15s' }}>
                        {isPinned ? '⭐' : '☆'}
                      </button>
                    </td>
                    <td style={{ padding:'10px 10px 10px 4px', whiteSpace:'nowrap' }}>
                      <div style={{ display:'flex', alignItems:'center', gap:'6px' }}>
                        <button onClick={()=>{ const order=['active','paused','churned']; const i=order.indexOf(lc); setLifecycle(b.brand, order[(i+1)%3]); }}
                          title={`Lifecycle: ${lcCfg.label} — click to change`}
                          style={{ background:'none', border:'none', cursor:'pointer', fontSize:'11px', color:lcCfg.color, padding:'1px 3px', borderRadius:'3px', background:lcCfg.bg, fontWeight:700, flexShrink:0 }}>
                          {lcCfg.dot}
                        </button>
                        <span style={{ color:'#F1F5F9', fontWeight:600 }}>{b.brand}</span>
                      </div>
                    </td>
                    <td style={{ padding:'10px 14px' }}>
                      {pm ? (
                        <div style={{ display:'flex', alignItems:'center', gap:'6px' }}>
                          <div style={{ width:'20px', height:'20px', borderRadius:'5px', background:`${pm.color}22`, border:`1px solid ${pm.color}55`, display:'flex', alignItems:'center', justifyContent:'center', fontSize:'9px', fontWeight:700, color:pm.color }}>{initials(pm.name)}</div>
                          <span style={{ color:'#64748B', fontSize:'12px' }}>{pm.name}</span>
                        </div>
                      ) : <span style={{ color:'#334155', fontSize:'12px' }}>—</span>}
                    </td>
                    <td style={{ padding:'10px 14px', textAlign:'right', color:b.today>0?'#F1F5F9':'#475569', fontWeight:b.today>0?700:400 }}>{b.today||'—'}</td>
                    <td style={{ padding:'10px 14px', textAlign:'right', color:'#94A3B8' }}>{b.avg7d.toFixed(1)}</td>
                    <td style={{ padding:'10px 14px', textAlign:'right' }}>
                      <span style={{ color:'#7B5FFF', fontWeight:600 }}>{b.mtdAvg.toFixed(1)}</span>
                      <span style={{ color:'#475569', fontSize:'10px', marginLeft:'3px' }}>/d</span>
                    </td>
                    <td style={{ padding:'10px 14px', textAlign:'right' }}>
                      {b.lastMoSum!=null ? (
                        <span style={{ color:lmColor, fontWeight:600 }}>
                          {b.lastMoSum}
                          {lmDiff!==null&&lmDiff!==0 && <span style={{ fontSize:'10px', marginLeft:'4px', fontWeight:700 }}>{lmDiff>0?'▲':'▼'}{Math.abs(lmDiff)}</span>}
                        </span>
                      ) : <span style={{ color:'#334155' }}>—</span>}
                    </td>
                    <td style={{ padding:'10px 14px' }}><Sparkline data={b.last7} /></td>
                    <td style={{ padding:'10px 14px' }}>
                      <span className="status-badge" style={{ background:sc.bg, color:sc.color }}>{sc.icon} {sc.label}</span>
                    </td>
                    <td style={{ padding:'10px 14px', minWidth:'95px' }}>
                      <input type="number" min="0" value={goals[b.brand]||''} onChange={e=>updateGoal(b.brand,e.target.value)} placeholder="Set goal"
                        style={{ width:'80px', background:'#091626', border:'1px solid rgba(148,163,184,0.1)', color:'#94A3B8', padding:'3px 7px', borderRadius:'5px', fontSize:'12px', textAlign:'center' }} />
                    </td>
                    <td style={{ padding:'10px 14px', textAlign:'right', color:b.mtdApproved>0?'#F59E0B':'#475569', fontWeight:b.mtdApproved>0?700:400 }}>{b.mtdApproved||'—'}</td>
                    <td style={{ padding:'10px 14px', textAlign:'right' }}>
                      {left!==null ? <span style={{ color:leftColor, fontWeight:700 }}>{left<=0?'✓ Done':left}</span> : <span style={{ color:'#334155' }}>—</span>}
                    </td>
                  </tr>
                );
              })}
              {filtered.length===0 && <tr><td colSpan={12} style={{ padding:'40px', textAlign:'center', color:'#475569' }}>No brands match the current filter.</td></tr>}
            </tbody>
          </table>
        </div>
        <div style={{ padding:'10px 16px', borderTop:'1px solid rgba(148,163,184,0.06)', fontSize:'11px', color:'#475569', display:'flex', gap:'16px', flexWrap:'wrap', background:'#030b18' }}>
          {Object.entries(STATUS_CONFIG).map(([k,v])=>(
            <span key={k}><span style={{color:v.color}}>{v.icon} {v.label}</span>: {k==='active'?'posting recently':k==='dipped'?'dropped >50% vs prior week':k==='pipeline'?'samples approved, no videos yet':'no activity in 14 days'}</span>
          ))}
          <span style={{ marginLeft:'auto', color:'#334155' }}>Last Mo. = {lastMoLabel} · MTD Avg = daily rate this month · Left = Goal − Approved MTD</span>
        </div>
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════════════════════
// SETTINGS MODAL
// ════════════════════════════════════════════════════════════════════════════
function SettingsModal({ pms, setPms, brandList, brandMap, assignBrand, brandLifecycle, setLifecycle, customBrands, addCustomBrand, removeCustomBrand, prioritySet, onClearCache, onClose }) {
  const [tab, setTab]         = useState('brands');
  const [newName, setNewName] = useState('');
  const [search, setSearch]   = useState('');
  const [newBrand, setNewBrand] = useState({ name:'', pmId:'', goal:'', onboarded: new Date().toISOString().slice(0,10) });

  const addPm = () => { if (!newName.trim()) return; setPms(prev=>[...prev,{id:'pm_'+Date.now(),name:newName.trim(),color:PM_COLORS[prev.length%PM_COLORS.length]}]); setNewName(''); };
  const allBrands = [...new Set([...brandList, ...customBrands.map(b=>b.name)])];
  const filtered  = allBrands.filter(b=>b.toLowerCase().includes(search.toLowerCase()));

  const TABS = [['brands','Assign PMs'],['lifecycle','Brand Status'],['add','Add Brand'],['pms','Manage PMs']];

  return (
    <div style={{ position:'fixed', inset:0, background:'rgba(3,11,24,0.75)', backdropFilter:'blur(6px)', display:'flex', alignItems:'center', justifyContent:'center', zIndex:100 }}
      onClick={e=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div style={{ background:'#071120', border:'1px solid rgba(123,95,255,0.2)', borderRadius:'14px', width:'640px', maxHeight:'86vh', display:'flex', flexDirection:'column', boxShadow:'0 24px 64px rgba(0,0,0,0.6)' }}>
        <div style={{ padding:'16px 22px', borderBottom:'1px solid rgba(148,163,184,0.08)', display:'flex', justifyContent:'space-between', alignItems:'center', flexShrink:0 }}>
          <span style={{ fontWeight:800, fontSize:'15px', color:'#F1F5F9' }}>⚙ Settings</span>
          <div style={{ display:'flex', gap:'8px', alignItems:'center' }}>
            <button onClick={onClearCache} title="Clear cached API data to force a refresh" style={{ background:'transparent', border:'1px solid rgba(148,163,184,0.1)', color:'#475569', padding:'4px 10px', borderRadius:'6px', cursor:'pointer', fontSize:'11px' }}>Clear Cache</button>
            <button onClick={onClose} style={{ background:'#091626', border:'1px solid rgba(148,163,184,0.1)', color:'#64748B', cursor:'pointer', fontSize:'14px', width:'28px', height:'28px', borderRadius:'7px', display:'flex', alignItems:'center', justifyContent:'center' }}>✕</button>
          </div>
        </div>
        <div style={{ display:'flex', borderBottom:'1px solid rgba(148,163,184,0.08)', flexShrink:0 }}>
          {TABS.map(([t,l])=>(
            <button key={t} onClick={()=>setTab(t)} style={{ flex:1, padding:'10px 6px', background:tab===t?'#050c17':'transparent', border:'none', borderBottom:tab===t?'2px solid #7B5FFF':'2px solid transparent', color:tab===t?'#F1F5F9':'#64748B', cursor:'pointer', fontSize:'12px', fontWeight:tab===t?700:400 }}>{l}</button>
          ))}
        </div>
        <div style={{ flex:1, overflowY:'auto', padding:'18px' }}>

          {/* ── Assign PMs ── */}
          {tab==='brands' && (
            <div>
              <div style={{ fontSize:'12px', color:'#64748B', marginBottom:'12px' }}>Assign each brand to a PM. Changes save automatically.</div>
              <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍  Search brands…"
                style={{ width:'100%', background:'#091626', border:'1px solid rgba(148,163,184,0.1)', color:'#94A3B8', padding:'8px 12px', borderRadius:'7px', fontSize:'13px', marginBottom:'12px' }} />
              {filtered.map(brand=>(
                <div key={brand} style={{ display:'flex', alignItems:'center', gap:'10px', padding:'7px 0', borderBottom:'1px solid rgba(148,163,184,0.06)' }}>
                  <span style={{ flex:1, color:'#F1F5F9', fontSize:'13px', display:'flex', alignItems:'center', gap:'6px' }}>
                    {customBrands.find(b=>b.name===brand) && <span style={{ fontSize:'10px', color:'#7B5FFF', background:'rgba(123,95,255,0.12)', padding:'1px 5px', borderRadius:'3px' }}>NEW</span>}
                    {brand}
                  </span>
                  <select value={brandMap[brand]||''} onChange={e=>assignBrand(brand,e.target.value)}
                    style={{ background:'#091626', border:'1px solid rgba(148,163,184,0.1)', color:'#94A3B8', padding:'4px 8px', borderRadius:'5px', fontSize:'12px', cursor:'pointer' }}>
                    <option value="">— Unassigned —</option>
                    {pms.map(pm=><option key={pm.id} value={pm.id}>{pm.name}</option>)}
                  </select>
                </div>
              ))}
              {filtered.length===0 && <div style={{ color:'#475569', textAlign:'center', padding:'20px' }}>No brands match.</div>}
            </div>
          )}

          {/* ── Brand Status / Lifecycle ── */}
          {tab==='lifecycle' && (
            <div>
              <div style={{ fontSize:'12px', color:'#64748B', marginBottom:'4px' }}>Set lifecycle status per brand. <strong style={{ color:'#EF4444' }}>Churned</strong> brands are dimmed in the tracker.</div>
              <div style={{ display:'flex', gap:'8px', marginBottom:'14px', flexWrap:'wrap' }}>
                {Object.entries(LC).map(([k,v])=>(<span key={k} style={{ fontSize:'11px', background:v.bg, color:v.color, padding:'3px 9px', borderRadius:'12px', fontWeight:700 }}>{v.dot} {v.label}</span>))}
              </div>
              <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍  Search brands…"
                style={{ width:'100%', background:'#091626', border:'1px solid rgba(148,163,184,0.1)', color:'#94A3B8', padding:'8px 12px', borderRadius:'7px', fontSize:'13px', marginBottom:'12px' }} />
              {filtered.map(brand=>{ const lc = brandLifecycle[brand]||'active'; return (
                <div key={brand} style={{ display:'flex', alignItems:'center', gap:'10px', padding:'7px 0', borderBottom:'1px solid rgba(148,163,184,0.06)' }}>
                  <span style={{ flex:1, color: lc==='churned'?'#475569':'#F1F5F9', fontSize:'13px', textDecoration: lc==='churned'?'line-through':'' }}>{brand}</span>
                  <span style={{ fontSize:'10px', color:'#475569' }}>{prioritySet.has(brand)?'⭐':''}</span>
                  <div style={{ display:'flex', gap:'4px' }}>
                    {Object.entries(LC).map(([k,v])=>(<button key={k} onClick={()=>setLifecycle(brand,k)} style={{ padding:'3px 9px', borderRadius:'5px', fontSize:'11px', fontWeight:lc===k?700:400, cursor:'pointer', border:'none', background:lc===k?v.bg:'transparent', color:lc===k?v.color:'#475569', outline:lc===k?`1px solid ${v.color}55`:'1px solid rgba(148,163,184,0.08)' }}>{v.dot} {v.label}</button>))}
                  </div>
                </div>
              );})}
            </div>
          )}

          {tab==='add' && (
            <div>
              <div style={{ fontSize:'12px', color:'#64748B', marginBottom:'16px' }}>Add a new brand before it appears in the API. It'll show 0 video/GMV until data flows through.</div>
              <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:'12px', marginBottom:'12px' }}>
                <div><label style={{ fontSize:'11px', color:'#475569', display:'block', marginBottom:'5px', fontWeight:700 }}>Brand Name *</label>
                  <input value={newBrand.name} onChange={e=>setNewBrand(p=>({...p,name:e.target.value}))} placeholder="e.g. Ritual Vitamins" style={{ width:'100%', background:'#091626', border:'1px solid rgba(148,163,184,0.1)', color:'#94A3B8', padding:'8px 12px', borderRadius:'7px', fontSize:'13px' }} /></div>
                <div><label style={{ fontSize:'11px', color:'#475569', display:'block', marginBottom:'5px', fontWeight:700 }}>PM</label>
                  <select value={newBrand.pmId} onChange={e=>setNewBrand(p=>({...p,pmId:e.target.value}))} style={{ width:'100%', background:'#091626', border:'1px solid rgba(148,163,184,0.1)', color:'#94A3B8', padding:'8px 12px', borderRadius:'7px', fontSize:'13px', cursor:'pointer' }}>
                    <option value="">— Unassigned —</option>
                    {pms.map(pm=><option key={pm.id} value={pm.id}>{pm.name}</option>)}
                  </select></div>
                <div><label style={{ fontSize:'11px', color:'#475569', display:'block', marginBottom:'5px', fontWeight:700 }}>Sample Goal</label>
                  <input type="number" value={newBrand.goal} onChange={e=>setNewBrand(p=>({...p,goal:e.target.value}))} placeholder="e.g. 500" style={{ width:'100%', background:'#091626', border:'1px solid rgba(148,163,184,0.1)', color:'#94A3B8', padding:'8px 12px', borderRadius:'7px', fontSize:'13px' }} /></div>
                <div><label style={{ fontSize:'11px', color:'#475569', display:'block', marginBottom:'5px', fontWeight:700 }}>Onboarding Date</label>
                  <input type="date" value={newBrand.onboarded} onChange={e=>setNewBrand(p=>({...p,onboarded:e.target.value}))} style={{ width:'100%', background:'#091626', border:'1px solid rgba(148,163,184,0.1)', color:'#94A3B8', padding:'8px 12px', borderRadius:'7px', fontSize:'13px' }} /></div>
              </div>
              <button onClick={()=>{ if(!newBrand.name.trim()) return; addCustomBrand({name:newBrand.name.trim(),pmId:newBrand.pmId,goal:newBrand.goal,onboarded:newBrand.onboarded}); if(newBrand.pmId) assignBrand(newBrand.name.trim(),newBrand.pmId); setNewBrand({name:'',pmId:'',goal:'',onboarded:new Date().toISOString().slice(0,10)}); }}
                style={{ background:'#7B5FFF', border:'none', color:'#fff', padding:'10px 20px', borderRadius:'8px', cursor:'pointer', fontSize:'13px', fontWeight:700, boxShadow:'0 0 16px rgba(123,95,255,0.35)', marginBottom:'24px' }}>+ Add Brand</button>
              <div style={{ fontSize:'11px', color:'#475569', textTransform:'uppercase', letterSpacing:'0.7px', fontWeight:700, marginBottom:'10px' }}>Custom Brands ({customBrands.length})</div>
              {customBrands.length===0 && <div style={{ color:'#334155', fontSize:'13px' }}>No custom brands yet.</div>}
              {customBrands.map(b=>(<div key={b.name} style={{ display:'flex', alignItems:'center', gap:'10px', padding:'8px 0', borderBottom:'1px solid rgba(148,163,184,0.06)' }}>
                <div style={{ flex:1 }}><div style={{ color:'#F1F5F9', fontSize:'13px', fontWeight:600 }}>{b.name}</div><div style={{ fontSize:'11px', color:'#475569' }}>Onboarded {b.onboarded} · Goal: {b.goal||'—'} · {pms.find(p=>p.id===b.pmId)?.name||'Unassigned'}</div></div>
                <button onClick={()=>removeCustomBrand(b.name)} style={{ background:'transparent', border:'1px solid #EF4444', color:'#EF4444', padding:'4px 10px', borderRadius:'5px', cursor:'pointer', fontSize:'12px' }}>Remove</button>
              </div>))}
            </div>
          )}

          {tab==='pms' && (
            <div>
              <div style={{ fontSize:'12px', color:'#64748B', marginBottom:'8px' }}>Share PM view: <code style={{ background:'rgba(123,95,255,0.12)', color:'#a58bff', padding:'1px 6px', borderRadius:'3px', fontSize:'11px' }}>{window.location.origin+window.location.pathname}?pm=<em>id</em></code></div>
              <div style={{ display:'flex', gap:'8px', marginBottom:'18px' }}>
                <input value={newName} onChange={e=>setNewName(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addPm()} placeholder="New PM name…" style={{ flex:1, background:'#091626', border:'1px solid rgba(148,163,184,0.1)', color:'#94A3B8', padding:'8px 12px', borderRadius:'7px', fontSize:'13px' }} />
                <button onClick={addPm} style={{ background:'#7B5FFF', border:'none', color:'#fff', padding:'8px 16px', borderRadius:'7px', cursor:'pointer', fontSize:'13px', fontWeight:700, boxShadow:'0 0 16px rgba(123,95,255,0.35)' }}>+ Add PM</button>
              </div>
              {pms.map(pm=>(<div key={pm.id} style={{ display:'flex', alignItems:'center', gap:'10px', padding:'8px 0', borderBottom:'1px solid rgba(148,163,184,0.06)' }}>
                <div style={{ width:'28px', height:'28px', borderRadius:'7px', background:`${pm.color}22`, border:`1px solid ${pm.color}44`, display:'flex', alignItems:'center', justifyContent:'center', fontSize:'10px', fontWeight:800, color:pm.color, flexShrink:0 }}>{initials(pm.name)}</div>
                <input value={pm.name} onChange={e=>setPms(prev=>prev.map(p=>p.id===pm.id?{...p,name:e.target.value}:p))} style={{ flex:1, background:'transparent', border:'1px solid transparent', color:'#F1F5F9', padding:'5px 8px', borderRadius:'5px', fontSize:'13px' }} onFocus={e=>e.target.style.borderColor='rgba(123,95,255,0.3)'} onBlur={e=>e.target.style.borderColor='transparent'} />
                <span style={{ fontSize:'11px', color:'#475569', cursor:'pointer', padding:'2px 6px', background:'rgba(123,95,255,0.08)', borderRadius:'4px' }} onClick={()=>navigator.clipboard?.writeText(window.location.origin+window.location.pathname+'?pm='+pm.id)} title="Copy shareable link">🔗 {pm.id}</span>
                <button onClick={()=>setPms(prev=>prev.filter(p=>p.id!==pm.id))} style={{ background:'transparent', border:'1px solid #EF4444', color:'#EF4444', padding:'4px 10px', borderRadius:'5px', cursor:'pointer', fontSize:'12px' }}>Remove</button>
              </div>))}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}
