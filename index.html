// PRIORITY VIEW
// ════════════════════════════════════════════════════════════════════════════
function PriorityView({ dates, videoData, videoLoading, pms, brandMap, goals, brandLifecycle, prioritySet, togglePriority, setView }) {
  const today        = dates[0] || '';
  const currentMonth = today.slice(0,7);
  const mtdDates     = useMemo(() => dates.filter(d=>d.startsWith(currentMonth)), [dates,currentMonth]);

  const pinnedData = useMemo(() => {
    return [...prioritySet].map(brand => {
      const getVids = d => (videoData[d]||[]).find(r=>r.brand_name===brand)?.new_videos||0;
      const getSamp = d => (videoData[d]||[]).find(r=>r.brand_name===brand)?.sample_approved||0;
      const getGmv  = d => (videoData[d]||[]).find(r=>r.brand_name===brand)?.gmv||0;
      const todayVids   = getVids(today);
      const avg7d       = dates.slice(0,7).reduce((s,d)=>s+getVids(d),0)/7;
      const mtdSum      = mtdDates.reduce((s,d)=>s+getVids(d),0);
      const mtdAvg      = mtdDates.length ? mtdSum/mtdDates.length : 0;
      const mtdApproved = mtdDates.reduce((s,d)=>s+getSamp(d),0);
      const todayGmv    = getGmv(today);
      const last7vids   = dates.slice(0,7).map(getVids);
      const lc          = brandLifecycle[brand] || 'active';
      const pm          = pms.find(p=>p.id===brandMap[brand]);
      const goal        = parseInt(goals[brand]||0);
      const goalPct     = goal>0 ? Math.min(100,(mtdApproved/goal)*100) : null;
      const status      = computeBrandVideoStatus(brand, dates, videoData);
      return { brand, todayVids, avg7d, mtdSum, mtdAvg, mtdApproved, todayGmv, last7vids, lc, pm, goal, goalPct, status, atGoal: todayVids>=VIDEO_GOAL };
    }).sort((a,b)=>b.avg7d-a.avg7d);
  }, [prioritySet, videoData, dates, mtdDates, brandLifecycle, brandMap, pms, goals, today]);

  const atGoalCount  = pinnedData.filter(b=>b.atGoal).length;
  const totalGoalPct = pinnedData.length ? Math.round((atGoalCount/pinnedData.length)*100) : 0;

  return (
    <div className="fade-in">
      <div style={{ display:'flex', alignItems:'center', gap:'12px', marginBottom:'24px', flexWrap:'wrap' }}>
        <div>
          <h2 style={{ fontSize:'20px', fontWeight:800, color:'#F1F5F9', letterSpacing:'-0.4px' }}>⭐ Priority Brands</h2>
          <div style={{ fontSize:'12px', color:'#475569', marginTop:'2px' }}>{prioritySet.size}/20 pinned · {atGoalCount} at 100/day goal</div>
        </div>
        <div style={{ marginLeft:'auto', display:'flex', gap:'10px', alignItems:'center' }}>
          {videoLoading && <span style={{ fontSize:'12px', color:'#475569', display:'flex', gap:'5px', alignItems:'center' }}><Spinner />Loading…</span>}
          <button onClick={()=>setView('video')} style={{ background:'rgba(123,95,255,0.12)', border:'1px solid rgba(123,95,255,0.25)', color:'#a58bff', padding:'7px 14px', borderRadius:'8px', cursor:'pointer', fontSize:'12px', fontWeight:700 }}>Pin brands in Video Tracker →</button>
        </div>
      </div>

      {prioritySet.size === 0 ? (
        <div style={{ display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', height:'40vh', gap:'12px', color:'#475569' }}>
          <div style={{ fontSize:'40px' }}>☆</div>
          <div style={{ fontSize:'16px', fontWeight:700, color:'#94A3B8' }}>No priority brands pinned yet</div>
          <div style={{ fontSize:'13px' }}>Go to <strong style={{ color:'#7B5FFF' }}>Video Tracker</strong> and click ☆ on any brand (max 20).</div>
          <button onClick={()=>setView('video')} style={{ marginTop:'8px', background:'#7B5FFF', border:'none', color:'#fff', padding:'9px 20px', borderRadius:'8px', cursor:'pointer', fontSize:'13px', fontWeight:700, boxShadow:'0 0 20px rgba(123,95,255,0.35)' }}>Open Video Tracker</button>
        </div>
      ) : (
        <>
          <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(150px,1fr))', gap:'12px', marginBottom:'24px' }}>
            <StatCard label="Pinned"      value={`${prioritySet.size}/20`} color="#7B5FFF" icon="⭐" />
            <StatCard label="At Goal"     value={`${atGoalCount}/${pinnedData.length}`} color={totalGoalPct>=80?'#10B981':totalGoalPct>=50?'#38BDF8':'#EF4444'} icon="🎯" bar={totalGoalPct} />
            <StatCard label="Videos Today" value={pinnedData.reduce((s,b)=>s+b.todayVids,0).toString()} color="#38BDF8" icon="🎬" />
            <StatCard label="GMV Today"   value={fmt$(pinnedData.reduce((s,b)=>s+b.todayGmv,0))} color="#10B981" icon="💰" />
          </div>
          <div className="card" style={{ overflow:'hidden' }}>
            <div style={{ overflowX:'auto' }}>
              <table style={{ width:'100%', borderCollapse:'collapse', fontSize:'13px' }}>
                <thead>
                  <tr style={{ background:'#050c17', borderBottom:'1px solid rgba(148,163,184,0.06)' }}>
                    {['Brand','PM','Today','Last 7','7D Avg','MTD Avg','GMV Today','Goal %','Status','Unpin'].map(h=>(
                      <th key={h} style={{ padding:'10px 14px', textAlign: ['Today','7D Avg','MTD Avg','GMV Today'].includes(h)?'right':'left', color:'#475569', fontSize:'11px', fontWeight:700, textTransform:'uppercase', whiteSpace:'nowrap' }}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {pinnedData.map(b => {
                    const lcc   = LC[b.lc];
                    const sc    = STATUS_CONFIG[b.status];
                    const heatBg = b.todayVids>=VIDEO_GOAL?'rgba(16,185,129,0.05)':b.todayVids>=VIDEO_GOAL*0.5?'rgba(245,158,11,0.04)':b.todayVids>0?'rgba(239,68,68,0.04)':'transparent';
                    const vc    = b.todayVids>=VIDEO_GOAL?'#10B981':b.todayVids>=VIDEO_GOAL*0.7?'#38BDF8':b.todayVids>0?'#F59E0B':'#334155';
                    return (
                      <tr key={b.brand} className="hover-row" style={{ borderBottom:'1px solid rgba(148,163,184,0.06)', background:heatBg }}>
                        <td style={{ padding:'11px 14px' }}>
                          <div style={{ display:'flex', alignItems:'center', gap:'6px' }}>
                            <span style={{ fontSize:'10px', color:lcc.color, background:lcc.bg, padding:'1px 4px', borderRadius:'3px', fontWeight:700 }}>{lcc.dot}</span>
                            <span style={{ color:'#F1F5F9', fontWeight:600, whiteSpace:'nowrap' }}>{b.brand}</span>
                          </div>
                        </td>
                        <td style={{ padding:'11px 14px' }}>{b.pm?<span style={{ fontSize:'12px', color:b.pm.color, background:`${b.pm.color}22`, padding:'2px 7px', borderRadius:'4px', fontWeight:700 }}>{b.pm.name}</span>:<span style={{ color:'#334155' }}>—</span>}</td>
                        <td style={{ padding:'11px 14px', textAlign:'right' }}><span style={{ color:vc, fontWeight:800, fontSize:'15px' }}>{b.todayVids||'—'}</span>{b.atGoal&&<span style={{ marginLeft:'4px', fontSize:'10px', color:'#10B981' }}>✓</span>}</td>
                        <td style={{ padding:'11px 14px' }}><Sparkline data={b.last7vids} /></td>
                        <td style={{ padding:'11px 14px', textAlign:'right', color:'#94A3B8' }}>{b.avg7d.toFixed(1)}</td>
                        <td style={{ padding:'11px 14px', textAlign:'right', color:'#7B5FFF', fontWeight:600 }}>{b.mtdAvg.toFixed(1)}</td>
                        <td style={{ padding:'11px 14px', textAlign:'right', color:'#10B981', fontWeight:700 }}>{fmt$(b.todayGmv)}</td>
                        <td style={{ padding:'11px 14px', minWidth:'120px' }}>
                          {b.goalPct!==null?(<div style={{ display:'flex', alignItems:'center', gap:'6px' }}><div style={{ flex:1, background:'#091626', borderRadius:'3px', height:'4px' }}><div style={{ height:'100%', borderRadius:'3px', width:`${b.goalPct}%`, background:b.goalPct>=100?'#10B981':b.goalPct>=60?'#F59E0B':'#EF4444' }}/></div><span style={{ fontSize:'11px', color:b.goalPct>=100?'#10B981':b.goalPct>=60?'#F59E0B':'#EF4444', fontWeight:700 }}>{b.goalPct.toFixed(0)}%</span></div>):<span style={{ color:'#334155', fontSize:'12px' }}>—</span>}
                        </td>
                        <td style={{ padding:'11px 14px' }}><span className="status-badge" style={{ background:sc.bg, color:sc.color }}>{sc.label}</span></td>
                        <td style={{ padding:'11px 14px', textAlign:'center' }}><button onClick={()=>togglePriority(b.brand)} style={{ background:'none', border:'none', cursor:'pointer', color:'#F59E0B', fontSize:'16px' }} title="Unpin">⭐</button></td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        </>
      )}
    </div>
  );
}

// PM SHARE VIEW  (?pm=id URL)
// ════════════════════════════════════════════════════════════════════════════
function PMShareView({ pm, brands, byBrand, goals, updateGoal, brandLifecycle }) {
  const weekKey = useMemo(() => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-w${Math.ceil(d.getDate()/7)}`; }, []);
  const [weekTargets, setWeekTargets] = useState(() => lsGet(`tts_wt_${pm.id}`, {}));
  const setTarget = (brand, val) => { const n={...weekTargets,[brand]:val}; setWeekTargets(n); lsSet(`tts_wt_${pm.id}`,n); };
  const activeBrands = brands.filter(b=>(brandLifecycle[b]||'active')!=='churned');
  const totalGmv  = activeBrands.reduce((s,b)=>s+(byBrand[b]?.gmv||0),0);
  const totalVids = activeBrands.reduce((s,b)=>s+(byBrand[b]?.new_videos||0),0);
  return (
    <div style={{ maxWidth:'900px', margin:'0 auto', padding:'32px 24px' }}>
      <div style={{ display:'flex', alignItems:'center', gap:'12px', marginBottom:'32px' }}>
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M11 2L20 11L11 20L2 11L11 2Z" fill="url(#pg-sh)"/><defs><linearGradient id="pg-sh" x1="2" y1="2" x2="20" y2="20" gradientUnits="userSpaceOnUse"><stop stopColor="#38BDF8"/><stop offset="1" stopColor="#7B5FFF"/></linearGradient></defs></svg>
        <span style={{ fontWeight:800, fontSize:'15px', color:'#F1F5F9' }}>TTS Ops</span>
        <div style={{ marginLeft:'16px', width:'1px', height:'20px', background:'rgba(148,163,184,0.1)' }}/>
        <div style={{ width:'36px', height:'36px', borderRadius:'10px', background:`${pm.color}22`, border:`1px solid ${pm.color}55`, display:'flex', alignItems:'center', justifyContent:'center', fontSize:'14px', fontWeight:800, color:pm.color }}>{initials(pm.name)}</div>
        <div><div style={{ fontWeight:700, fontSize:'18px', color:'#F1F5F9' }}>{pm.name}'s Brands</div><div style={{ fontSize:'12px', color:'#475569' }}>{activeBrands.length} active brands · week {weekKey}</div></div>
      </div>
      <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:'12px', marginBottom:'28px' }}>
        <StatCard label="Total GMV"    value={fmt$(totalGmv)}  color="#10B981" icon="💰" />
        <StatCard label="Total Videos" value={fmtN(totalVids)} color="#38BDF8" icon="🎬" />
        <StatCard label="Active Brands" value={activeBrands.length.toString()} color="#7B5FFF" icon="📦" />
      </div>
      <div className="card" style={{ overflow:'hidden' }}>
        <div style={{ overflowX:'auto' }}>
          <table style={{ width:'100%', borderCollapse:'collapse', fontSize:'13px' }}>
            <thead>
              <tr style={{ background:'#050c17', borderBottom:'1px solid rgba(148,163,184,0.06)' }}>
                {['Brand','Videos','GMV','Req','Approved','Weekly Target'].map(h=>(<th key={h} style={{ padding:'10px 14px', textAlign:'left', color:'#475569', fontSize:'11px', fontWeight:700, textTransform:'uppercase' }}>{h}</th>))}
              </tr>
            </thead>
            <tbody>
              {activeBrands.map(brand => { const d=byBrand[brand]; const lc=brandLifecycle[brand]||'active'; return (
                <tr key={brand} className="hover-row" style={{ borderBottom:'1px solid rgba(148,163,184,0.06)' }}>
                  <td style={{ padding:'10px 14px', color:'#F1F5F9', fontWeight:600 }}><span style={{ fontSize:'10px', color:LC[lc].color, marginRight:'6px' }}>{LC[lc].dot}</span>{brand}</td>
                  <td style={{ padding:'10px 14px', color:'#94A3B8' }}>{fmtN(d?.new_videos)}</td>
                  <td style={{ padding:'10px 14px', color:'#10B981', fontWeight:700 }}>{fmt$(d?.gmv)}</td>
                  <td style={{ padding:'10px 14px' }}>{fmtN(d?.sample_request)}</td>
                  <td style={{ padding:'10px 14px', color:'#F59E0B', fontWeight:700 }}>{fmtN(d?.sample_approved)}</td>
                  <td style={{ padding:'10px 14px' }}><input type="number" min="0" placeholder="Set target" value={weekTargets[brand]||''} onChange={e=>setTarget(brand,e.target.value)} style={{ width:'100px', background:'#091626', border:'1px solid rgba(148,163,184,0.1)', color:'#94A3B8', padding:'4px 8px', borderRadius:'5px', fontSize:'12px', textAlign:'center' }}/></td>
                </tr>
              );})}
            </tbody>
          </table>
        </div>
        <div style={{ padding:'10px 16px', borderTop:'1px solid rgba(148,163,184,0.06)', fontSize:'11px', color:'#475569', background:'#030b18' }}>Weekly targets saved locally on this device · Churned brands hidden</div>
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════════════════════
// SMALL COMPONENTS
// ════════════════════════════════════════════════════════════════════════════
function StatCard({ label, value, sub, color, icon, bar }) {
  return (
    <div style={{ background:'#071120', border:'1px solid rgba(148,163,184,0.08)', borderRadius:'11px', padding:'16px', position:'relative', overflow:'hidden' }}>
      <div style={{ position:'absolute', top:0, left:0, width:'3px', height:'100%', background:color||'#7B5FFF', borderRadius:'11px 0 0 11px' }} />
      <div style={{ paddingLeft:'4px' }}>
        <div style={{ fontSize:'10px', color:'#475569', fontWeight:700, textTransform:'uppercase', letterSpacing:'0.7px', marginBottom:'7px', display:'flex', alignItems:'center', gap:'4px' }}>{icon&&<span>{icon}</span>}{label}</div>
        <div style={{ fontSize:'22px', fontWeight:800, color:color||'#a58bff', lineHeight:1, letterSpacing:'-0.5px' }}>{value}</div>
        {sub && <div style={{ fontSize:'11px', color:'#64748B', marginTop:'4px' }}>{sub}</div>}
        {bar!=null && <div style={{ marginTop:'10px', background:'#091626', borderRadius:'4px', height:'4px' }}><div style={{ height:'100%', borderRadius:'4px', width:`${bar}%`, background:color||'#7B5FFF', transition:'width 0.3s' }} /></div>}
      </div>
    </div>
  );
}

function MiniStat({ label, value, color }) {
  return (
    <div style={{ background:'#050c17', borderRadius:'7px', padding:'8px 10px' }}>
      <div style={{ fontSize:'10px', color:'#475569', marginBottom:'3px', textTransform:'uppercase', letterSpacing:'0.5px' }}>{label}</div>
      <div style={{ fontSize:'15px', fontWeight:800, color }}>{value}</div>
    </div>
  );
}

function Th({ label, col, sortBy, sortDir, onSort, right }) {
  const active = col && sortBy===col;
  return (
    <th onClick={()=>col&&onSort&&onSort(col)} style={{ padding:'10px 14px', textAlign:right?'right':'left', cursor:col?'pointer':'default', color:active?'#7B5FFF':'#475569', fontSize:'11px', fontWeight:700, textTransform:'uppercase', letterSpacing:'0.6px', whiteSpace:'nowrap', userSelect:'none' }}>
      {label}{active?(sortDir==='asc'?' ↑':' ↓'):''}
    </th>
  );
}

function Sparkline({ data, height=28, width=72 }) {
  if (!data||data.every(v=>v===0)) return <span style={{ color:'#334155', fontSize:'11px' }}>no activity</span>;
  const max = Math.max(...data, 1);
  const pts = data.map((v,i)=>`${(i/(data.length-1))*width},${height-(v/max)*(height-2)}`).join(' ');
  const color = data[0]>data[data.length-1]*0.5?'#10B981':'#EF4444';
  return (
    <svg width={width} height={height} viewBox={`0 0 ${width} ${height}`} style={{ overflow:'visible' }}>
      <polyline points={pts} fill="none" stroke={color} strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round" />
      <circle cx={pts.split(' ')[0].split(',')[0]} cy={pts.split(' ')[0].split(',')[1]} r="2.5" fill={color} />
    </svg>
  );
}

function DonutProgress({ value, max, color }) {
  const pct=Math.min(value/max,1), r=30, cx=40, cy=40, circ=2*Math.PI*r;
  return (
    <svg width="80" height="80" viewBox="0 0 80 80">
      <circle cx={cx} cy={cy} r={r} fill="none" stroke="#0a1628" strokeWidth="8" />
      <circle cx={cx} cy={cy} r={r} fill="none" stroke={color} strokeWidth="8" strokeDasharray={circ} strokeDashoffset={circ*(1-pct)} strokeLinecap="round" transform="rotate(-90 40 40)" style={{ transition:'stroke-dashoffset 0.5s ease' }} />
      <text x={cx} y={cy-4} textAnchor="middle" fill={color} fontSize="16" fontWeight="800">{value}</text>
      <text x={cx} y={cy+10} textAnchor="middle" fill="#475569" fontSize="10">/{max}</text>
    </svg>
  );
}

function Spinner({ size=12 }) {
  const [r, setR] = useState(0);
  useEffect(() => { const id=setInterval(()=>setR(v=>(v+30)%360),100); return ()=>clearInterval(id); }, []);
  return <svg width={size} height={size} viewBox="0 0 12 12" style={{ flexShrink:0 }}><circle cx="6" cy="6" r="4" fill="none" stroke="#7B5FFF" strokeWidth="2" strokeDasharray="12 6" transform={`rotate(${r} 6 6)`} /></svg>;
}

function EmptyState() {
  return (
    <div style={{ display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', height:'55vh', gap:'12px', color:'#475569' }}>
      <div style={{ fontSize:'48px' }}>👈</div>
      <div style={{ fontSize:'16px', fontWeight:700, color:'#94A3B8' }}>Select a PM to view their brands</div>
      <div style={{ fontSize:'13px' }}>Or switch to <strong style={{ color:'#7B5FFF' }}>Manager View</strong> for the full team overview</div>
    </div>
  );
}

function CorsError() {
  return (
    <div style={{ display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', height:'55vh', gap:'12px', maxWidth:'520px', margin:'0 auto', textAlign:'center' }}>
      <div style={{ fontSize:'44px' }}>🚫</div>
      <div style={{ fontSize:'16px', fontWeight:800, color:'#EF4444' }}>API Access Blocked</div>
      <div style={{ fontSize:'13px', color:'#64748B', lineHeight:1.7 }}>The n8n proxy workflows (<code style={{ background:'rgba(123,95,255,0.12)', padding:'1px 6px', borderRadius:'4px', color:'#a58bff' }}>tts-proxy-dates</code> / <code style={{ background:'rgba(123,95,255,0.12)', padding:'1px 6px', borderRadius:'4px', color:'#a58bff' }}>tts-proxy-report</code>) may be inactive. Check that both workflows are Active in n8n.</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
