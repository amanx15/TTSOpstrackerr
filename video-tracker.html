    select:focus { outline: 1px solid var(--purple); }

function computeBrandVideoStatus(brand, dates, videoData) {
  const getVids = d => (videoData[d]||[]).find(r=>r.brand_name===brand)?.new_videos || 0;
  const getSamp = d => (videoData[d]||[]).find(r=>r.brand_name===brand)?.sample_approved || 0;
  const last7sum = dates.slice(0,7).reduce((s,d)=>s+getVids(d),0);
  const prev7sum = dates.slice(7,14).reduce((s,d)=>s+getVids(d),0);
  const recentSamples = dates.slice(0,7).reduce((s,d)=>s+getSamp(d),0);
  if (last7sum===0 && recentSamples>0) return 'pipeline';
  if (last7sum===0 && prev7sum===0)    return 'inactive';
  if (prev7sum>=3 && last7sum < prev7sum*0.5) return 'dipped';
  return 'active';
}

// ════════════════════════════════════════════════════════════
// APP
// ════════════════════════════════════════════════════════════
function App() {
  const [dates, setDates]         = useState([]);
  const [videoData, setVideoData] = useState({});
  const [loading, setLoading]     = useState(true);
  const [apiError, setApiError]   = useState('');
  const [pms]                     = useState(() => lsGet('tts_pms', DEFAULT_PMS));
  const [brandMap]                = useState(() => lsGet('tts_brand_map', DEFAULT_BRAND_MAP));
  const [goals, setGoals]         = useState(() => ({ ...DEFAULT_GOALS, ...lsGet('tts_goals', {}) }));

  useEffect(() => lsSet('tts_goals', goals), [goals]);

  useEffect(() => {
    fetch(API_DATES)
      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(d => {
        const list = Array.isArray(d) ? d : (d.dates||[]);
        setDates(list);
        if (!list.length) { setLoading(false); return; }
        const today = list[0];
        const currentMonth = today.slice(0,7);
        const dayOfMonth = parseInt(today.slice(8,10));
        const lmd = new Date(today); lmd.setDate(1); lmd.setMonth(lmd.getMonth()-1);
        const lastMoPrefix = `${lmd.getFullYear()}-${String(lmd.getMonth()+1).padStart(2,'0')}`;
        const mtdDates = list.filter(d=>d.startsWith(currentMonth));
        const lastMoDates = list.filter(d=>d.startsWith(lastMoPrefix) && parseInt(d.slice(8,10)) <= dayOfMonth);
        const allNeeded = [...new Set([...list.slice(0,30), ...mtdDates, ...lastMoDates])];
        Promise.all(allNeeded.map(d => fetch(`${API_REPORT}?date=${d}`).then(r=>r.json()).catch(()=>[])))
          .then(results => {
            const next = {};
            allNeeded.forEach((d,i) => { next[d] = results[i]; });
            setVideoData(next);
            setLoading(false);
          });
      })
      .catch(() => { setApiError('error'); setLoading(false); });
  }, []);

  const updateGoal = (brand, val) => setGoals(prev => ({ ...prev, [brand]: val }));

  return (
    <div style={{ display:'flex', flexDirection:'column', minHeight:'100vh' }}>
      {/* ── Header ── */}
      <header style={{ borderBottom:'1px solid rgba(148,163,184,0.08)', padding:'0 32px', display:'flex', alignItems:'center', gap:'16px', height:'56px', flexShrink:0, backdropFilter:'blur(12px)', background:'rgba(3,11,24,0.8)', position:'sticky', top:0, zIndex:50 }}>
        {/* Pattern diamond logo */}
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
          <path d="M11 2L20 11L11 20L2 11L11 2Z" fill="url(#pg)" />
          <defs>
            <linearGradient id="pg" x1="2" y1="2" x2="20" y2="20" gradientUnits="userSpaceOnUse">
              <stop stopColor="#38BDF8"/>
              <stop offset="1" stopColor="#7B5FFF"/>
            </linearGradient>
          </defs>
        </svg>
        <span style={{ fontSize:'14px', fontWeight:700, color:'#F1F5F9', letterSpacing:'-0.2px' }}>Video Tracker</span>
        <span style={{ fontSize:'11px', color:'var(--t3)', background:'rgba(123,95,255,0.1)', border:'1px solid rgba(123,95,255,0.2)', padding:'2px 9px', borderRadius:'20px', fontWeight:600 }}>Pattern TTS</span>
        {loading && <span style={{ display:'flex', alignItems:'center', gap:'7px', fontSize:'12px', color:'var(--t3)', marginLeft:'4px' }}><Spinner />Loading data…</span>}
        <div style={{ marginLeft:'auto', fontSize:'11px', color:'var(--t3)' }}>
          {dates[0] && <span>Latest: <span style={{ color:'var(--cyan)' }}>{dates[0]}</span></span>}
        </div>
      </header>

      <main style={{ flex:1, padding:'28px 32px', maxWidth:'1600px', width:'100%', margin:'0 auto' }}>
        {apiError ? <CorsError /> : loading && !Object.keys(videoData).length ? (
          <div style={{ display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', height:'55vh', gap:'14px', color:'var(--t3)' }}>
            <Spinner size={28} /><span style={{ fontSize:'14px' }}>Fetching video data…</span>
          </div>
        ) : (
          <VideoTracker dates={dates} videoData={videoData} pms={pms} brandMap={brandMap} goals={goals} updateGoal={updateGoal} />
        )}
      </main>
    </div>
  );
}

// ════════════════════════════════════════════════════════════
// VIDEO TRACKER
// ════════════════════════════════════════════════════════════
function VideoTracker({ dates, videoData, pms, brandMap, goals, updateGoal }) {
  const [statusFilter, setStatusFilter] = useState('all');
  const [pmFilter, setPmFilter]         = useState('all');
  const [vtSort, setVtSort]             = useState('avg7d');
  const [vtDir, setVtDir]               = useState('desc');
  const [vtDate, setVtDate]             = useState('');
  const [aiKey, setAiKey]               = useState(() => lsGet('tts_bf_vk', ''));
  const [aiInsight, setAiInsight]       = useState('');
  const [aiLoading, setAiLoading]       = useState(false);
  const [showAi, setShowAi]             = useState(false);

  useEffect(() => lsSet('tts_bf_vk', aiKey), [aiKey]);

  const handleVtSort = col => { if(vtSort===col){setVtDir(d=>d==='desc'?'asc':'desc');}else{setVtSort(col);setVtDir('desc');} };

  const today         = dates[0] || '';
  const effectiveDate = vtDate || today;
  const currentMonth  = today.slice(0,7);
  const dayOfMonth    = parseInt(today.slice(8,10)) || 1;

  const lastMoPrefix = useMemo(() => {
    if (!today) return '';
    const d = new Date(today); d.setDate(1); d.setMonth(d.getMonth()-1);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  }, [today]);

  const mtdDates    = useMemo(() => dates.filter(d=>d.startsWith(currentMonth)), [dates, currentMonth]);
  const lastMoDates = useMemo(() => dates.filter(d=>d.startsWith(lastMoPrefix) && parseInt(d.slice(8,10))<=dayOfMonth), [dates, lastMoPrefix, dayOfMonth]);
  const lastMoLabel = lastMoPrefix ? `${lastMoPrefix.slice(5)} 1-${String(dayOfMonth).padStart(2,'0')}` : 'Last Mo.';
  const loadedDates = useMemo(() => dates.slice(0,30).filter(d => videoData[d]?.length > 0), [dates, videoData]);

  const allBrands = useMemo(() => {
    if (!dates.length || !videoData[dates[0]]) return [];
    return [...new Set(dates.slice(0,14).flatMap(d=>(videoData[d]||[]).map(r=>r.brand_name).filter(Boolean)))];
  }, [dates, videoData]);

  const brandAnalysis = useMemo(() => {
    if (!dates.length) return [];
    return allBrands.map(brand => {
      const getVids = d => (videoData[d]||[]).find(r=>r.brand_name===brand)?.new_videos||0;
      const getSamp = d => (videoData[d]||[]).find(r=>r.brand_name===brand)?.sample_approved||0;
      const last7    = dates.slice(0,7).map(getVids);
      const last7sum = last7.reduce((a,b)=>a+b,0);
      const prev7sum = dates.slice(7,14).reduce((s,d)=>s+getVids(d),0);
      const mtdSum   = mtdDates.reduce((s,d)=>s+getVids(d),0);
      const mtdAvg   = mtdDates.length ? mtdSum/mtdDates.length : 0;
      const mtdApproved = mtdDates.reduce((s,d)=>s+getSamp(d),0);
      const lastMoSum = lastMoDates.length>0 ? lastMoDates.reduce((s,d)=>s+getVids(d),0) : null;
      const status   = computeBrandVideoStatus(brand, dates, videoData);
      const todayVids = (videoData[effectiveDate]||[]).find(r=>r.brand_name===brand)?.new_videos||0;
      return { brand, last7, last7sum, prev7sum, avg7d:last7sum/7, today:todayVids, mtdSum, mtdAvg, mtdApproved, lastMoSum, status, pmId:brandMap[brand] };
    }).sort((a,b)=>b.last7sum-a.last7sum);
  }, [allBrands, dates, videoData, brandMap, mtdDates, lastMoDates, effectiveDate]);

  const dailyTotals = useMemo(() => dates.slice(0,7).map(d=>({ date:d.slice(5), total:(videoData[d]||[]).reduce((s,r)=>s+(r.new_videos||0),0) })), [dates, videoData]);
  const vtTodayTotal = (videoData[effectiveDate]||[]).reduce((s,r)=>s+(r.new_videos||0),0);
  const avg7d        = dailyTotals.length ? dailyTotals.reduce((s,d)=>s+d.total,0)/dailyTotals.length : 0;
  const mtdPortfolioTotal = useMemo(()=>mtdDates.reduce((sum,d)=>(videoData[d]||[]).reduce((s,r)=>s+(r.new_videos||0),sum),0),[mtdDates,videoData]);
  const mtdPortfolioAvg   = mtdDates.length ? mtdPortfolioTotal/mtdDates.length : 0;

  const statusCounts = brandAnalysis.reduce((acc,b)=>{ acc[b.status]=(acc[b.status]||0)+1; return acc; }, {});
  const brandsAtGoal = brandAnalysis.filter(b=>b.today>=VIDEO_GOAL).length;
  const totalBrands  = brandAnalysis.length;
  const vtGoalPct    = totalBrands > 0 ? Math.min(100,(brandsAtGoal/totalBrands)*100) : 0;
  const goalColor    = vtGoalPct>=80?'var(--green)':vtGoalPct>=50?'var(--cyan)':vtGoalPct>=30?'var(--amber)':'var(--red)';
  const chartMax     = Math.max(...dailyTotals.map(d=>d.total), VIDEO_GOAL, 1);

  const filtered = useMemo(() => {
    const arr = brandAnalysis.filter(b=>(statusFilter==='all'||b.status===statusFilter)&&(pmFilter==='all'||b.pmId===pmFilter));
    return [...arr].sort((a,b)=>{
      let va,vb;
      if      (vtSort==='today')    { va=a.today;         vb=b.today; }
      else if (vtSort==='avg7d')    { va=a.avg7d;         vb=b.avg7d; }
      else if (vtSort==='mtdAvg')   { va=a.mtdAvg;        vb=b.mtdAvg; }
      else if (vtSort==='lastMo')   { va=a.lastMoSum??-1; vb=b.lastMoSum??-1; }
      else if (vtSort==='approved') { va=a.mtdApproved;   vb=b.mtdApproved; }
      else                          { va=a.avg7d;         vb=b.avg7d; }
      return vtDir==='asc'?va-vb:vb-va;
    });
  }, [brandAnalysis, statusFilter, pmFilter, vtSort, vtDir, goals]);

  const downloadCSV = () => {
    const header = ['Brand','PM','Status',`Videos on ${effectiveDate}`,'MTD Total','MTD Avg/d','Approved MTD','Sample Goal','7D Avg'];
    const rows = filtered.map(b => {
      const pm = pms.find(p=>p.id===b.pmId);
      const sc = STATUS_CONFIG[b.status];
      return [b.brand, pm?.name||'', sc.label, b.today, b.mtdSum, b.mtdAvg.toFixed(1), b.mtdApproved, parseInt(goals[b.brand]||0)||'', b.avg7d.toFixed(1)];
    });
    const csv = [header,...rows].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob([csv],{type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href=url; a.download=`tts-video-report-${effectiveDate}.csv`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  };

  const generateAiInsights = async () => {
    if (!aiKey.trim()) { setAiInsight('⚠️ Please enter your Bifrost virtual key above.'); return; }
    setAiLoading(true); setAiInsight('');
    const dipped   = brandAnalysis.filter(b=>b.status==='dipped').map(b=>({ brand:b.brand, avg7d:b.avg7d.toFixed(0), prev7:b.prev7sum, last7:b.last7sum, pm:pms.find(p=>p.id===b.pmId)?.name||'?' }));
    const pipeline = brandAnalysis.filter(b=>b.status==='pipeline').map(b=>({ brand:b.brand, approved:b.mtdApproved, pm:pms.find(p=>p.id===b.pmId)?.name||'?' }));
    const below100 = brandAnalysis.filter(b=>b.mtdAvg<VIDEO_GOAL&&b.mtdAvg>0).sort((a,b)=>b.mtdAvg-a.mtdAvg).slice(0,8).map(b=>({ brand:b.brand, mtdAvg:b.mtdAvg.toFixed(1), pm:pms.find(p=>p.id===b.pmId)?.name||'?' }));
    const top5     = brandAnalysis.slice(0,5).map(b=>({ brand:b.brand, mtdAvg:b.mtdAvg.toFixed(1), pm:pms.find(p=>p.id===b.pmId)?.name||'?' }));
    const prompt = `You are a TikTok Shop video analytics expert at Pattern.com. Analyze this portfolio data and provide actionable insights.

TODAY: ${effectiveDate}
PORTFOLIO: ${totalBrands} brands, ${brandsAtGoal} hitting 100+ videos/day goal (${vtGoalPct.toFixed(0)}%)
PORTFOLIO MTD AVG: ${mtdPortfolioAvg.toFixed(0)} videos/day

TOP PERFORMING BRANDS (MTD avg/day):
${top5.map(b=>`- ${b.brand}: ${b.mtdAvg}/day (PM: ${b.pm})`).join('\n')}

DIPPED BRANDS (dropped >50% vs prior week):
${dipped.length ? dipped.map(b=>`- ${b.brand}: now ${b.last7} videos this week vs ${b.prev7} last week (PM: ${b.pm})`).join('\n') : 'None'}

IN PIPELINE (samples approved, no videos posted):
${pipeline.length ? pipeline.map(b=>`- ${b.brand}: ${b.approved} samples approved (PM: ${b.pm})`).join('\n') : 'None'}

BRANDS BELOW 100/DAY GOAL (closest to target):
${below100.map(b=>`- ${b.brand}: ${b.mtdAvg}/day (PM: ${b.pm})`).join('\n')}

Provide:
1. **Volume drop analysis** — for each dipped brand, hypothesize why and what action to take
2. **Pipeline unlock** — specific nudges to convert pipeline brands to active posters
3. **Quick wins** — which below-100 brands can realistically hit 100/day this week and how
4. **Pattern of drops** — any common timing or triggers across dipped brands

Be specific, direct, and actionable. No fluff.`;

    try {
      const res = await fetch(BIFROST, {
        method: 'POST',
        headers: { 'Content-Type':'application/json', 'x-api-key':'dummy-key', 'anthropic-version':'2023-06-01', 'x-bf-vk': aiKey.trim() },
        body: JSON.stringify({ model:'claude-opus-4-6', max_tokens:1024, messages:[{ role:'user', content:prompt }] })
      });
      const data = await res.json();
      if (data.content?.[0]?.text) setAiInsight(data.content[0].text);
      else setAiInsight('No insight returned. Check your virtual key.');
    } catch(e) {
      setAiInsight('Error reaching Bifrost. Make sure you are on the Pattern network.');

  const todayLabel = vtDate ? vtDate.slice(5) : 'Today';

  return (
    <div className="fade-in">

      {/* ── Page title ── */}

          <p style={{ fontSize:'12px', color:'var(--t3)', marginTop:'2px' }}>TikTok Shop affiliate video performance across the portfolio</p>
        </div>

          <button className="btn-ai" onClick={()=>setShowAi(v=>!v)}>✦ AI Insights</button>

              type="password" value={aiKey} onChange={e=>setAiKey(e.target.value)}
              placeholder="Bifrost virtual key (x-bf-vk) — get from IT"
              style={{ flex:1, background:'rgba(3,11,24,0.6)', border:'1px solid rgba(56,189,248,0.2)', color:'var(--t2)', padding:'8px 14px', borderRadius:'9px', fontSize:'12px' }}
            />
            <button className="btn-ai" onClick={generateAiInsights} disabled={aiLoading} style={{ whiteSpace:'nowrap' }}>
              {aiLoading ? <><Spinner />Analyzing…</> : '✦ Generate'}
            </button>
          </div>
          {aiInsight && <div className="ai-insight">{aiInsight}</div>}
          {!aiInsight && !aiLoading && (
            <p style={{ fontSize:'12px', color:'var(--t3)', marginTop:'12px' }}>
              Claude will analyze dipped brands, pipeline stalls, and quick-win opportunities across your {totalBrands} brands. Requires IT-issued Bifrost virtual key.
            </p>

      {/* ── KPI row ── */}
      <div style={{ display:'grid', gridTemplateColumns:'auto 1fr auto', gap:'16px', marginBottom:'24px', alignItems:'stretch' }}>

        {/* Donut */}
        <div className="card-glow" style={{ padding:'20px 24px', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:'10px', minWidth:'156px' }}>
          <DonutProgress value={brandsAtGoal} max={totalBrands} color={goalColor} />
          <div style={{ textAlign:'center' }}>
            <div style={{ fontSize:'12px', fontWeight:700, color:'var(--t1)' }}>Brands at Goal</div>
            <div style={{ fontSize:'10px', color:'var(--t3)', marginTop:'2px' }}>≥{VIDEO_GOAL} videos/brand/day</div>
          </div>
        </div>

        {/* Stat cards */}
        <div style={{ display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:'12px' }}>
          <StatCard label={vtDate ? vtDate.slice(5) : 'Today'} value={vtTodayTotal.toLocaleString()} sub={`${brandsAtGoal}/${totalBrands} brands at goal`} accent="var(--purple)" />
          <StatCard label="7-Day Avg"  value={avg7d.toFixed(0)}              sub="portfolio videos/day"  accent="var(--cyan)" />
          <StatCard label="MTD Avg"    value={mtdPortfolioAvg.toFixed(0)}    sub={`${mtdDates.length} days · ${mtdPortfolioTotal.toLocaleString()} total`} accent="var(--purple)" />
          <StatCard label="Pipeline"   value={(statusCounts.pipeline||0).toString()} sub="samples approved, awaiting" accent="var(--amber)" />
        </div>

        {/* Mini bar chart */}
        <div className="card" style={{ padding:'16px 20px', minWidth:'240px' }}>
          <div style={{ fontSize:'10px', fontWeight:700, color:'var(--t3)', textTransform:'uppercase', letterSpacing:'0.8px', marginBottom:'12px' }}>Last 7 Days</div>
          <div style={{ display:'flex', alignItems:'flex-end', gap:'5px', height:'52px' }}>
            {dailyTotals.slice().reverse().map((d,i) => {
              const h = Math.max(3,(d.total/chartMax)*52);
              const isToday = i === dailyTotals.length - 1;
              const col = isToday ? 'var(--purple)' : d.total >= VIDEO_GOAL ? 'var(--green)' : 'var(--slate)';
              return (
                <div key={d.date} style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center', gap:'4px' }}>
                  <div style={{ width:'100%', height:`${h}px`, background:col, borderRadius:'3px 3px 0 0', opacity:isToday?1:0.6, transition:'height 0.3s' }} title={`${d.date}: ${d.total}`} />
                  <div style={{ fontSize:'9px', color:isToday?'var(--cyan)':'var(--t3)', whiteSpace:'nowrap' }}>{d.date}</div>

      </div>

      {/* ── Status filters ── */}
      <div style={{ display:'flex', alignItems:'center', gap:'8px', marginBottom:'16px', flexWrap:'wrap' }}>
        <span style={{ fontSize:'10px', color:'var(--t3)', fontWeight:700, textTransform:'uppercase', letterSpacing:'0.8px' }}>Filter</span>
        {[['all','All',brandAnalysis.length],...Object.entries(STATUS_CONFIG).map(([k,v])=>[k,v.label,statusCounts[k]||0])].map(([v,l,cnt]) => {
          const cfg = STATUS_CONFIG[v];
          const isActive = statusFilter === v;
          return (
            <button key={v} onClick={()=>setStatusFilter(v)} className="filter-btn" style={{
              background: isActive ? (cfg?.bg || 'var(--purple-lo)') : 'transparent',
              color: isActive ? (cfg?.color || 'var(--purple)') : 'var(--t3)',
              borderColor: isActive ? (cfg?.color || 'var(--purple)') + '55' : 'var(--border)',
              fontWeight: isActive ? 700 : 500,
            }}>
              {l} <span style={{ opacity:0.65 }}>({cnt})</span>
            </button>
          );
        })}

        <div style={{ marginLeft:'auto', display:'flex', gap:'8px', alignItems:'center' }}>
          <select value={vtDate} onChange={e=>setVtDate(e.target.value)}>
            <option value="">Latest ({today})</option>
            {loadedDates.slice(1).map(d=><option key={d} value={d}>{d}</option>)}
          </select>
          <select value={pmFilter} onChange={e=>setPmFilter(e.target.value)}>
            <option value="all">All PMs</option>
            {pms.map(pm=><option key={pm.id} value={pm.id}>{pm.name}</option>)}
          </select>
        </div>
      </div>

      {/* ── Table ── */}
      <div className="card" style={{ overflow:'hidden' }}>
        <div style={{ overflowX:'auto' }}>
          <table style={{ width:'100%', borderCollapse:'collapse', fontSize:'13px' }}>
            <thead>
              <tr style={{ background:'rgba(0,0,0,0.3)', borderBottom:'1px solid var(--border)' }}>
                <Th label="#" />
                <Th label="Brand" />
                <Th label="PM" />
                <Th label={todayLabel}  col="today"    sortBy={vtSort} sortDir={vtDir} onSort={handleVtSort} right />
                <Th label="7D Avg"      col="avg7d"    sortBy={vtSort} sortDir={vtDir} onSort={handleVtSort} right />
                <Th label="MTD Avg"     col="mtdAvg"   sortBy={vtSort} sortDir={vtDir} onSort={handleVtSort} right />
                <Th label={lastMoLabel} col="lastMo"   sortBy={vtSort} sortDir={vtDir} onSort={handleVtSort} right />
                <Th label="Last 7 Days" />
                <Th label="Status" />
                <Th label="Approved MTD" col="approved" sortBy={vtSort} sortDir={vtDir} onSort={handleVtSort} right />
              </tr>
            </thead>
            <tbody>
              {filtered.map((b, idx) => {
                const sc = STATUS_CONFIG[b.status];
                const pm = pms.find(p=>p.id===b.pmId);
                const lmDiff = (b.lastMoSum!=null&&b.mtdSum!=null) ? b.mtdSum - b.lastMoSum : null;
                const lmColor= lmDiff===null?'var(--t3)':lmDiff>0?'var(--green)':lmDiff<0?'var(--red)':'var(--t3)';
                const atGoal = b.mtdAvg >= VIDEO_GOAL;
                return (
                  <tr key={b.brand} className="hover-row" style={{ borderBottom:'1px solid var(--border)' }}>
                    <td style={{ padding:'11px 8px 11px 16px', color:'var(--t3)', fontSize:'11px', width:'36px' }}>{idx+1}</td>
                    <td style={{ padding:'11px 14px' }}>
                      <span style={{ color:'var(--t1)', fontWeight:600 }}>{b.brand}</span>
                      {atGoal && <span style={{ marginLeft:'6px', fontSize:'10px', color:'var(--green)', fontWeight:700 }}>✓</span>}
                    </td>
                    <td style={{ padding:'11px 14px' }}>
                      {pm ? (
                        <div style={{ display:'flex', alignItems:'center', gap:'7px' }}>
                          <div style={{ width:'22px', height:'22px', borderRadius:'6px', background:`${pm.color}18`, border:`1px solid ${pm.color}40`, display:'flex', alignItems:'center', justifyContent:'center', fontSize:'9px', fontWeight:700, color:pm.color, flexShrink:0 }}>{initials(pm.name)}</div>
                          <span style={{ color:'var(--t2)', fontSize:'12px' }}>{pm.name}</span>
                        </div>
                      ) : <span style={{ color:'var(--t3)', fontSize:'12px' }}>—</span>}
                    </td>
                    <td style={{ padding:'11px 14px', textAlign:'right', color:b.today>0?'var(--t1)':'var(--t3)', fontWeight:b.today>=VIDEO_GOAL?700:400 }}>
                      {b.today>0 ? b.today : '—'}
                    </td>
                    <td style={{ padding:'11px 14px', textAlign:'right', color:'var(--t2)' }}>{b.avg7d.toFixed(1)}</td>
                    <td style={{ padding:'11px 14px', textAlign:'right' }}>
                      <span style={{ color: atGoal ? 'var(--green)' : b.mtdAvg > 60 ? 'var(--cyan)' : 'var(--t2)', fontWeight: atGoal ? 700 : 500 }}>
                        {b.mtdAvg.toFixed(1)}
                      </span>
                      <span style={{ color:'var(--t3)', fontSize:'10px', marginLeft:'2px' }}>/d</span>
                    </td>
                    <td style={{ padding:'11px 14px', textAlign:'right' }}>
                      {b.lastMoSum!=null ? (
                        <span style={{ color:lmColor, fontWeight:500 }}>
                          {b.lastMoSum}
                          {lmDiff!==null&&lmDiff!==0 && <span style={{ fontSize:'10px', marginLeft:'3px' }}>{lmDiff>0?'▲':'▼'}{Math.abs(lmDiff)}</span>}
                        </span>
                      ) : <span style={{ color:'var(--border)' }}>—</span>}
                    </td>
                    <td style={{ padding:'11px 14px' }}><Sparkline data={b.last7} /></td>
                    <td style={{ padding:'11px 14px' }}>
                      <span className="status-badge" style={{ background:sc.bg, color:sc.color }}>{sc.icon} {sc.label}</span>
                    </td>
                    <td style={{ padding:'11px 14px', textAlign:'right', color:b.mtdApproved>0?'var(--amber)':'var(--t3)', fontWeight:b.mtdApproved>0?600:400 }}>
                      {b.mtdApproved||'—'}
                    </td>
                  </tr>
                );
              })}
              {filtered.length===0 && (
                <tr><td colSpan={10} style={{ padding:'48px', textAlign:'center', color:'var(--t3)' }}>No brands match the current filter.</td></tr>
              )}

          </table>
        </div>
        <div style={{ padding:'10px 16px', borderTop:'1px solid var(--border)', fontSize:'11px', color:'var(--t3)', display:'flex', gap:'16px', flexWrap:'wrap', background:'rgba(0,0,0,0.2)' }}>
          {Object.entries(STATUS_CONFIG).map(([k,v])=>(
            <span key={k}><span style={{color:v.color}}>{v.icon} {v.label}</span>: {k==='active'?'posting recently':k==='dipped'?'dropped >50% vs prior week':k==='pipeline'?'samples approved, no videos yet':'no activity in 14 days'}</span>
          ))}
          <span style={{ marginLeft:'auto' }}>Last Mo. = {lastMoLabel} · ✓ = at 100+/day MTD goal</span>
        </div>
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════
// COMPONENTS
// ════════════════════════════════════════════════════════════
function StatCard({ label, value, sub, accent }) {
  return (
    <div style={{ background:'var(--bg-card)', border:'1px solid var(--border)', borderRadius:'14px', padding:'16px 18px', position:'relative', overflow:'hidden' }}>
      <div style={{ position:'absolute', top:0, left:0, width:'3px', height:'100%', background:accent, borderRadius:'14px 0 0 14px' }} />
      <div style={{ paddingLeft:'6px' }}>
        <div style={{ fontSize:'10px', color:'var(--t3)', fontWeight:700, textTransform:'uppercase', letterSpacing:'0.8px', marginBottom:'8px' }}>{label}</div>
        <div style={{ fontSize:'24px', fontWeight:800, color:'var(--t1)', lineHeight:1, letterSpacing:'-0.5px' }}>{value}</div>
        {sub && <div style={{ fontSize:'11px', color:'var(--t3)', marginTop:'5px' }}>{sub}</div>}
      </div>
    </div>
  );
}

function Th({ label, col, sortBy, sortDir, onSort, right }) {
  const active = col && sortBy===col;
  return (
    <th onClick={()=>col&&onSort(col)} style={{ padding:'11px 14px', textAlign:right?'right':'left', cursor:col?'pointer':'default',
      color:active?'var(--cyan)':'var(--t3)', fontSize:'10px', fontWeight:700, textTransform:'uppercase', letterSpacing:'0.7px', whiteSpace:'nowrap', userSelect:'none' }}>
      {label}{active?(sortDir==='asc'?' ↑':' ↓'):''}
    </th>
  );
}

function Sparkline({ data, height=26, width=70 }) {
  if (!data||data.every(v=>v===0)) return <span style={{ color:'var(--t3)', fontSize:'11px' }}>—</span>;
  const max = Math.max(...data, 1);
  const pts = data.map((v,i)=>`${(i/(data.length-1))*width},${height-(v/max)*(height-2)}`).join(' ');
  const trending = data[0] >= data[data.length-1]*0.8;
  const color = trending ? '#10B981' : '#EF4444';
  return (
    <svg width={width} height={height} viewBox={`0 0 ${width} ${height}`} style={{ overflow:'visible' }}>
      <polyline points={pts} fill="none" stroke={color} strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round" />
      <circle cx={pts.split(' ')[0].split(',')[0]} cy={pts.split(' ')[0].split(',')[1]} r="2.5" fill={color} />
    </svg>
  );
}

function DonutProgress({ value, max, color }) {
  const pct = max > 0 ? Math.min(value/max, 1) : 0;
  const r=30, cx=40, cy=40, circ=2*Math.PI*r;
  return (
    <svg width="80" height="80" viewBox="0 0 80 80">
      <circle cx={cx} cy={cy} r={r} fill="none" stroke="rgba(148,163,184,0.08)" strokeWidth="8" />
      <circle cx={cx} cy={cy} r={r} fill="none" stroke={color} strokeWidth="8"
        strokeDasharray={circ} strokeDashoffset={circ*(1-pct)}
        strokeLinecap="round" transform="rotate(-90 40 40)" style={{ transition:'stroke-dashoffset 0.6s ease' }} />
      <text x={cx} y={cy-4} textAnchor="middle" fill={color} fontSize="16" fontWeight="800" fontFamily="Inter,sans-serif">{value}</text>
      <text x={cx} y={cy+10} textAnchor="middle" fill="#475569" fontSize="10" fontFamily="Inter,sans-serif">/{max}</text>
    </svg>
  );
}

function Spinner({ size=12 }) {
  const [r, setR] = React.useState(0);
  React.useEffect(() => { const id = setInterval(()=>setR(v=>(v+36)%360),80); return ()=>clearInterval(id); }, []);
  return <svg width={size} height={size} viewBox="0 0 12 12" style={{ flexShrink:0 }}><circle cx="6" cy="6" r="4" fill="none" stroke="var(--cyan)" strokeWidth="2" strokeDasharray="14 6" transform={`rotate(${r} 6 6)`} /></svg>;
}

function CorsError() {
  return (
    <div style={{ display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', height:'55vh', gap:'14px', maxWidth:'520px', margin:'0 auto', textAlign:'center' }}>
      <div style={{ width:'56px', height:'56px', borderRadius:'16px', background:'var(--red-lo)', border:'1px solid rgba(239,68,68,0.2)', display:'flex', alignItems:'center', justifyContent:'center', fontSize:'24px' }}>🚫</div>
      <div style={{ fontSize:'16px', fontWeight:800, color:'var(--red)' }}>API Access Blocked</div>
      <div style={{ fontSize:'13px', color:'var(--t3)', lineHeight:1.7 }}>
        The n8n proxy workflows may be inactive.<br/>
        Check that <code style={{ background:'var(--bg-card)', padding:'1px 6px', borderRadius:'4px', color:'var(--cyan)', fontSize:'12px' }}>tts-proxy-dates</code> and <code style={{ background:'var(--bg-card)', padding:'1px 6px', borderRadius:'4px', color:'var(--cyan)', fontSize:'12px' }}>tts-proxy-report</code> are <strong style={{ color:'var(--green)' }}>Active</strong> in n8n.
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
